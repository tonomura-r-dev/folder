<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>ワクトリ（WORKTRIP） LINE施策デモ</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e9ecf3;font-family:Meiryo,"Yu Gothic UI","Hiragino Sans",system-ui,sans-serif}
.ls-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:12px 16px;background:#1f285a;color:#fff}
.ls-head b{font-size:16px}
.ls-head span{font-size:12px;opacity:.85}
.ls-foot{padding:14px 16px 24px;text-align:center;font-size:11.5px;color:#6b7280}
/* デモ画面（スマホ枠・LINE・Web・裏側）。編集ツールと営業用HTMLで共通。
   すべて .lsp の中だけに効かせる。色は案件の配色を --lsp-* で受け取る。 */

.lsp {
  --lsp-primary: #1f285a;
  --lsp-accent: #06c755;
  --lsp-chat: #8fa9d4;
  --lsp-ink: #1f285a;
  --lsp-text: #2b3044;
  --lsp-muted: #6b7280;
  --lsp-line: #dce0e8;
  --lsp-soft: #eef1f7;
  --lsp-paper: #fff;
  --lsp-me: #8de39b;
  --lsp-line-green: #06c755;
  --lsp-warn: #b45309;
  --lsp-warn-soft: #fdf1e2;
  --lsp-err: #c0392b;
  font-family: Meiryo, "Yu Gothic UI", "Hiragino Sans", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  color: var(--lsp-text);
}
.lsp *, .lsp *::before, .lsp *::after { box-sizing: border-box; }
.lsp button { font: inherit; cursor: pointer; }
.lsp button:focus-visible, .lsp input:focus-visible, .lsp select:focus-visible { outline: 2px solid #3467b2; outline-offset: 2px; }

.lsp-stage { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; justify-content: center; padding: 20px; }
.lsp-error { padding: 20px; color: var(--lsp-err); background: #fbe5e2; border-radius: 10px; }

/* ---------- スマホ枠 ---------- */
.lsp-phone { width: 360px; flex: 0 0 360px; background: #15171f; border-radius: 34px; padding: 10px; box-shadow: 0 14px 40px rgba(20, 24, 40, .22); }
.lsp-status { display: flex; justify-content: space-between; color: #e8eaf2; font-size: 11.5px; padding: 2px 14px 6px; font-variant-numeric: tabular-nums; }
.lsp-screen { position: relative; height: 680px; border-radius: 24px; overflow: hidden; background: var(--lsp-paper); display: flex; flex-direction: column; }

/* ---------- はじめかた ---------- */
.lsp-start { flex: 1; overflow: auto; padding: 26px 18px; background: linear-gradient(180deg, #f4f6fb, #fff); }
.lsp-start-title { font-size: 18px; font-weight: 700; color: var(--lsp-ink); }
.lsp-start-sub { color: var(--lsp-muted); font-size: 12.5px; margin: 4px 0 18px; }
.lsp-start-group { font-size: 12px; font-weight: 700; color: var(--lsp-muted); margin: 16px 0 6px; }
.lsp-start button { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: 12px; border: 1px solid var(--lsp-line); background: var(--lsp-paper); color: var(--lsp-ink); font-weight: 700; }
.lsp-start button small { display: block; font-weight: 400; color: var(--lsp-muted); font-size: 11.5px; }
.lsp-start button.line { border-color: var(--lsp-line-green); color: #0b7a3a; }

/* ---------- Webページ ---------- */
.lsp-browser { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; background: #fff; }
.lsp-urlbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #f1f3f7; border-bottom: 1px solid var(--lsp-line); }
.lsp-urlbar button { border: 0; background: #fff; border-radius: 8px; width: 32px; height: 28px; font-size: 18px; line-height: 1; color: var(--lsp-ink); box-shadow: 0 0 0 1px var(--lsp-line); }
.lsp-url { flex: 1; font-size: 12px; color: var(--lsp-muted); background: #fff; border-radius: 999px; padding: 4px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lsp-page { flex: 1; overflow: auto; padding: 22px 18px 28px; }
.lsp-page h2 { font-size: 19px; line-height: 1.4; color: var(--lsp-primary); margin: 0 0 10px; }
.lsp-page p { margin: 0 0 14px; white-space: pre-wrap; }
.lsp-page img { width: 100%; border-radius: 10px; margin-bottom: 14px; display: block; }
.lsp-pbtn { display: block; width: 100%; padding: 13px; border-radius: 12px; border: 0; background: var(--lsp-primary); color: #fff; font-weight: 700; margin: 6px 0 12px; }
.lsp-form label { display: block; font-size: 12.5px; font-weight: 700; color: var(--lsp-ink); margin: 10px 0 4px; }
.lsp-form input, .lsp-form select { width: 100%; padding: 10px; border: 1px solid var(--lsp-line); border-radius: 8px; font: inherit; background: #fff; }
.lsp-form .lsp-pbtn { margin-top: 18px; }
.lsp-line-cta { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px; border: 0; border-radius: 12px; background: var(--lsp-line-green); color: #fff; font-weight: 700; margin: 8px 0; }
.lsp-line-cta::before { content: "LINE"; font-size: 10px; font-weight: 900; background: #fff; color: var(--lsp-line-green); border-radius: 6px; padding: 1px 5px; }
.lsp-fake { font-size: 11px; color: var(--lsp-muted); text-align: center; margin-top: 18px; }

.lsp-overlay { position: absolute; inset: 0; background: rgba(15, 18, 30, .55); display: flex; align-items: center; justify-content: center; padding: 22px; z-index: 5; }
.lsp-popup { background: #fff; border-radius: 16px; padding: 20px 18px 14px; width: 100%; text-align: center; box-shadow: 0 16px 40px rgba(0, 0, 0, .3); }
.lsp-popup img { width: 100%; border-radius: 10px; margin-bottom: 10px; }
.lsp-popup-title { font-size: 16.5px; font-weight: 700; color: var(--lsp-ink); line-height: 1.45; }
.lsp-popup-body { font-size: 13px; color: var(--lsp-text); margin: 8px 0 12px; white-space: pre-wrap; }
.lsp-popup-dismiss { border: 0; background: none; color: var(--lsp-muted); font-size: 12.5px; padding: 6px; text-decoration: underline; }

/* ---------- LINE トーク ---------- */
.lsp-talk { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--lsp-chat); }
.lsp-talkbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #fff; color: #111; font-weight: 700; font-size: 14.5px; border-bottom: 1px solid #e5e7eb; }
.lsp-talkbar .lsp-back { color: #444; font-size: 20px; line-height: 1; }
.lsp-banner { background: var(--lsp-warn-soft); color: var(--lsp-warn); font-size: 12.5px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
.lsp-banner button { margin-left: auto; border: 1px solid currentColor; background: #fff; color: var(--lsp-warn); border-radius: 8px; padding: 2px 8px; font-size: 12px; }
.lsp-chat { flex: 1; overflow-y: auto; padding: 12px 10px 16px; display: flex; flex-direction: column; gap: 6px; }
.lsp-sys { align-self: center; background: rgba(20, 30, 60, .32); color: #fff; font-size: 11px; padding: 3px 10px; border-radius: 999px; margin: 4px 0; }
.lsp-row { display: flex; gap: 6px; align-items: flex-end; }
.lsp-row.me { justify-content: flex-end; }
.lsp-avatar { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%; background: var(--lsp-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; align-self: flex-start; }
.lsp-avatar.ghost { visibility: hidden; }
.lsp-col { display: flex; flex-direction: column; gap: 2px; max-width: 76%; }
.lsp-name { font-size: 11px; color: rgba(255, 255, 255, .92); }
.lsp-time { font-size: 10px; color: rgba(255, 255, 255, .85); white-space: nowrap; }
.lsp-b { background: #fff; color: #111; border-radius: 16px; padding: 8px 12px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.lsp-row.bot .lsp-b { border-top-left-radius: 4px; }
.lsp-b.me { background: var(--lsp-me); border-top-right-radius: 4px; max-width: 76%; }
.lsp-b.img { padding: 0; overflow: hidden; }
.lsp-b.img img { display: block; width: 100%; }
.lsp-b.tmpl, .lsp-b.card { padding: 0; overflow: hidden; width: 240px; }
.lsp-tmpl-text { padding: 10px 12px; }
.lsp-card img { display: block; width: 100%; }
.lsp-card-title { padding: 10px 12px 2px; font-weight: 700; }
.lsp-card-body { padding: 0 12px 10px; font-size: 12.5px; color: #444; }
.lsp-btns { border-top: 1px solid #eceff4; display: flex; flex-direction: column; }
.lsp-btns button { border: 0; border-top: 1px solid #eceff4; background: #fff; color: #2a6fd6; padding: 10px; font-weight: 700; font-size: 13px; }
.lsp-btns button:first-child { border-top: 0; }
.lsp-btns button:hover { background: #f5f8fd; }
.lsp-noimg { display: flex; align-items: center; justify-content: center; height: 120px; background: #e6e9f0; color: var(--lsp-muted); font-size: 12px; }

.lsp-quick { background: #fff; border-top: 1px solid #e5e7eb; padding: 10px 10px 12px; }
.lsp-quick-q { font-size: 12.5px; font-weight: 700; color: #333; margin-bottom: 8px; }
.lsp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.lsp-chips button { border: 1.5px solid #2a6fd6; color: #2a6fd6; background: #fff; border-radius: 999px; padding: 5px 14px; font-weight: 700; font-size: 13px; }
.lsp-chips button.on { background: #2a6fd6; color: #fff; }
.lsp-quick .lsp-send-multi { margin-top: 8px; border: 0; background: #2a6fd6; color: #fff; border-radius: 8px; padding: 6px 14px; font-weight: 700; }

.lsp-menu { background: #fff; border-top: 1px solid #e5e7eb; }
.lsp-menu-bar { display: block; width: 100%; border: 0; background: #fff; color: #333; font-size: 12px; padding: 6px; font-weight: 700; }
.lsp-menu-grid { display: grid; gap: 1px; background: #d9dde6; border-top: 1px solid #d9dde6; position: relative; }
.lsp-menu-grid button { border: 0; background: var(--lsp-soft); color: var(--lsp-ink); font-weight: 700; font-size: 12.5px; padding: 6px 4px; min-height: 64px; }
.lsp-menu-grid button:hover { background: #e3e8f4; }
.lsp-menu-grid.has-img { background-size: 100% 100%; gap: 0; }
.lsp-menu-grid.has-img button { background: transparent; color: transparent; }
.lsp-menu-grid.has-img button:hover { background: rgba(255, 255, 255, .18); }

.lsp-input { display: flex; gap: 6px; padding: 8px; background: #fff; border-top: 1px solid #e5e7eb; }
.lsp-input input { flex: 1; border: 1px solid #e1e4ea; background: #f5f6f8; border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 13px; }
.lsp-input button { border: 0; background: var(--lsp-line-green); color: #fff; border-radius: 999px; padding: 0 14px; font-weight: 700; font-size: 13px; }
.lsp-input button:disabled, .lsp-input input:disabled { opacity: .45; cursor: default; }

/* ---------- 裏側（Phase 3 は最小限。Phase 4 で拡張） ---------- */
.lsp-side { width: 340px; flex: 0 1 340px; display: flex; flex-direction: column; gap: 12px; }
.lsp-card-side { background: #fff; border: 1px solid var(--lsp-line); border-radius: 14px; padding: 12px 14px; }
.lsp-card-side h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; color: var(--lsp-muted); }
.lsp-clock { font-size: 22px; font-weight: 700; color: var(--lsp-ink); font-variant-numeric: tabular-nums; }
.lsp-next { font-size: 12.5px; color: var(--lsp-text); margin: 4px 0 10px; }
.lsp-next b { color: var(--lsp-ink); }
.lsp-ctrls { display: flex; flex-wrap: wrap; gap: 6px; }
.lsp-ctrls button, .lsp-ctrls select { border: 1px solid var(--lsp-line); background: #fff; color: var(--lsp-ink); border-radius: 8px; padding: 5px 10px; font-weight: 700; font-size: 12.5px; }
.lsp-ctrls button.primary { background: var(--lsp-primary); border-color: var(--lsp-primary); color: #fff; }
.lsp-ctrls button:disabled { opacity: .45; cursor: default; }
.lsp-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
.lsp-kv dt { color: var(--lsp-muted); }
.lsp-kv dd { margin: 0; font-weight: 700; color: var(--lsp-ink); }
.lsp-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.lsp-tag { font-size: 12px; background: #f2eafb; color: #6b3fa0; padding: 1px 8px; border-radius: 999px; font-weight: 700; }
.lsp-none { color: var(--lsp-muted); font-size: 12.5px; }
.lsp-log { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
.lsp-log li { display: grid; grid-template-columns: 86px 1fr; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--lsp-soft); font-size: 12.5px; }
.lsp-log .t { color: var(--lsp-muted); font-variant-numeric: tabular-nums; }
.lsp-log .f { display: block; font-size: 11px; color: var(--lsp-muted); }
.lsp-log .reply { font-size: 10.5px; background: var(--lsp-soft); color: var(--lsp-muted); padding: 0 5px; border-radius: 4px; margin-left: 4px; }

/* ---------- Phase 4：上の操作帯 ---------- */
.lsp-bar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--lsp-line); padding: 8px 16px; display: flex; flex-direction: column; gap: 6px; }
.lsp-bar-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lsp-bar .lbl { font-size: 12px; font-weight: 700; color: var(--lsp-muted); margin-right: 2px; }
.lsp-bar button, .lsp-bar select, .lsp-bar input { border: 1px solid var(--lsp-line); background: #fff; color: var(--lsp-ink); border-radius: 8px; padding: 4px 9px; font: inherit; font-size: 12.5px; font-weight: 700; }
.lsp-bar input[type="number"] { width: 56px; }
.lsp-bar input[type="text"] { width: 62px; }
.lsp-bar button.primary { background: var(--lsp-primary); border-color: var(--lsp-primary); color: #fff; }
.lsp-bar button.on { background: #e8ecf8; border-color: var(--lsp-primary); }
.lsp-bar button.ghost { border-color: transparent; color: var(--lsp-muted); }
.lsp-bar .lsp-clock { font-size: 17px; font-weight: 700; color: var(--lsp-ink); font-variant-numeric: tabular-nums; margin-right: 6px; min-width: 112px; }
.lsp-group { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; color: var(--lsp-muted); }
.lsp-spacer { flex: 1; }
.lsp-playstate { font-size: 12.5px; color: var(--lsp-warn); font-weight: 700; }
.lsp-warn { font-size: 12px; color: var(--lsp-warn); background: var(--lsp-warn-soft); border-radius: 8px; padding: 4px 10px; }
.lsp-chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px !important; }
.lsp-chip small { font-size: 10.5px; font-weight: 700; background: var(--lsp-soft); color: var(--lsp-muted); border-radius: 999px; padding: 0 6px; }
.lsp-chip small.wait { background: var(--lsp-warn-soft); color: var(--lsp-warn); }
.lsp-chip.on { background: var(--lsp-primary) !important; border-color: var(--lsp-primary) !important; color: #fff !important; }
.lsp-chip.on small { background: rgba(255, 255, 255, .2); color: #fff; }
.lsp-empty { padding: 40px; text-align: center; color: var(--lsp-muted); }
.lsp-stage.phone { justify-content: center; }
.lsp-stage.full .lsp-side { width: 420px; flex: 0 1 420px; }

/* ---------- 説明カード ---------- */
.lsp-narr { background: #fff; border: 1px solid var(--lsp-line); border-left: 5px solid var(--lsp-primary); border-radius: 12px; padding: 12px 14px; }
.lsp-narr.empty { border-left-color: var(--lsp-line); }
.lsp-narr.empty .lsp-narr-title { color: var(--lsp-muted); font-size: 13px; font-weight: 400; }
.lsp-narr-eyebrow { font-size: 11.5px; font-weight: 700; color: var(--lsp-muted); letter-spacing: .06em; }
.lsp-narr-title { font-size: 16px; font-weight: 700; color: var(--lsp-ink); line-height: 1.45; margin: 2px 0; }
.lsp-narr-body { font-size: 13px; white-space: pre-wrap; }

/* ---------- 裏側のタブ ---------- */
.lsp-tabs-card { padding: 0 !important; overflow: hidden; }
.lsp-tabs { display: flex; border-bottom: 1px solid var(--lsp-line); background: #fafbfd; }
.lsp-tabs button { flex: 1; border: 0; background: none; padding: 9px 4px; font-size: 12.5px; font-weight: 700; color: var(--lsp-muted); border-bottom: 3px solid transparent; }
.lsp-tabs button.on { color: var(--lsp-ink); border-bottom-color: var(--lsp-primary); background: #fff; }
.lsp-tabbody { padding: 12px 14px; max-height: 560px; overflow: auto; }
.lsp-tabbody h4 { margin: 14px 0 6px; font-size: 12px; color: var(--lsp-muted); letter-spacing: .04em; }
.lsp-answers { font-size: 13px; }
.lsp-flows { list-style: none; padding: 0; margin: 0; }
.lsp-flows li { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--lsp-soft); font-size: 13px; }
.lsp-flows .f { display: block; font-size: 11.5px; color: var(--lsp-muted); }
.lsp-pill { font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 0 7px; flex: 0 0 auto; background: var(--lsp-soft); color: var(--lsp-muted); }
.lsp-pill.s-waiting, .lsp-pill.s-running { background: #e6f4f2; color: #00695f; }
.lsp-pill.s-stopped { background: #fbe5e2; color: var(--lsp-err); }
.lsp-hint { font-size: 11.5px; color: var(--lsp-muted); margin-top: 8px; }
.lsp-check { display: flex; align-items: center; gap: 6px; font-size: 12.5px; margin-bottom: 8px; }
.lsp-count { font-size: 13px; margin-bottom: 8px; }
.lsp-count .f { display: block; font-size: 11.5px; color: var(--lsp-muted); }

/* なぜ（判定の木） */
.lsp-whys { list-style: none; margin: 0; padding: 0; }
.lsp-why { border-bottom: 1px solid var(--lsp-soft); }
.lsp-why-head { display: grid; grid-template-columns: 18px 78px 1fr auto; gap: 6px; align-items: start; width: 100%; text-align: left; border: 0; background: none; padding: 7px 0; font-size: 12.5px; color: var(--lsp-text); }
.lsp-why-head:disabled { cursor: default; }
.lsp-why-head .t { color: var(--lsp-muted); font-variant-numeric: tabular-nums; }
.lsp-why-head .title { font-weight: 700; color: var(--lsp-ink); }
.lsp-why-head .reason { display: block; font-weight: 400; color: var(--lsp-text); }
.lsp-why-head .caret { color: var(--lsp-muted); font-size: 10px; }
.lsp-why .mark { font-weight: 900; }
.lsp-why.ok .mark { color: #0b7a3a; }
.lsp-why.ng .mark, .lsp-why.ng .title { color: var(--lsp-err); }
.lsp-why.stop .mark { color: var(--lsp-warn); }
.lsp-why.info .mark { color: #2a6fd6; }
.lsp-tree, .lsp-tree ul { list-style: none; margin: 0; padding-left: 14px; }
.lsp-tree { padding: 0 0 8px 24px; font-size: 12.5px; }
.lsp-tree li { padding: 2px 0 2px 8px; border-left: 2px solid var(--lsp-soft); }
.lsp-tree li .mark { display: inline-block; width: 16px; font-weight: 900; }
.lsp-tree li.yes > .mark { color: #0b7a3a; }
.lsp-tree li.no { color: var(--lsp-err); font-weight: 700; }
.lsp-tree li.no li.yes { color: var(--lsp-text); font-weight: 400; }

/* 誰に届く？ */
.lsp-matrix { overflow-x: auto; }
.lsp-matrix table { border-collapse: collapse; font-size: 12px; width: 100%; }
.lsp-matrix th, .lsp-matrix td { border-bottom: 1px solid var(--lsp-soft); padding: 3px 4px; text-align: left; vertical-align: top; }
.lsp-matrix thead th { font-size: 11.5px; color: var(--lsp-muted); white-space: nowrap; }
.lsp-matrix thead th.active { color: var(--lsp-ink); }
.lsp-matrix tr.grp th { background: var(--lsp-soft); color: var(--lsp-ink); font-size: 11.5px; }
.lsp-matrix th.msg { font-weight: 400; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lsp-matrix td button { border: 0; background: none; font: inherit; font-size: 11.5px; font-weight: 700; padding: 0; white-space: nowrap; }
.lsp-matrix td.ok button { color: #0b7a3a; }
.lsp-matrix td.ng button { color: var(--lsp-err); }
.lsp-matrix td.stop button { color: var(--lsp-warn); }
.lsp-matrix td.none button, .lsp-matrix td.wait button { color: var(--lsp-muted); font-weight: 400; }

/* ---------- 資料用 16:9 ---------- */
.lsp-slide-wrap { position: relative; width: 100%; overflow: hidden; }
.lsp-slide { position: absolute; top: 0; left: 0; transform-origin: 0 0; background: linear-gradient(135deg, #f4f6fb, #e9edf6); display: grid; grid-template-columns: 420px 1fr; gap: 28px; padding: 24px 40px 40px; box-sizing: border-box; }
.lsp-slide-left { display: flex; justify-content: center; }
.lsp-slide .lsp-screen { height: 600px; }
.lsp-slide-right { display: flex; flex-direction: column; gap: 14px; min-width: 0; padding-top: 8px; }
.lsp-slide-head { display: flex; justify-content: space-between; align-items: baseline; }
.lsp-slide-head .acc { font-size: 22px; font-weight: 700; color: var(--lsp-primary); }
.lsp-slide-head .clock { font-size: 22px; font-weight: 700; color: var(--lsp-ink); font-variant-numeric: tabular-nums; }
.lsp-slide-users { display: flex; gap: 6px; flex-wrap: wrap; }
.lsp-slide-users .lsp-chip { border: 1px solid var(--lsp-line); background: #fff; padding: 3px 12px; font-size: 14px; font-weight: 700; color: var(--lsp-ink); }
.lsp-narr.big { padding: 18px 22px; }
.lsp-narr.big .lsp-narr-eyebrow { font-size: 14px; }
.lsp-narr.big .lsp-narr-title { font-size: 26px; }
.lsp-narr.big .lsp-narr-body { font-size: 18px; }
.lsp-slide-box { background: #fff; border: 1px solid var(--lsp-line); border-radius: 14px; padding: 14px 20px; }
.lsp-slide-box h4 { margin: 0 0 8px; font-size: 15px; color: var(--lsp-muted); }
.lsp-slide-box .lsp-tag { font-size: 16px; padding: 3px 12px; }
.lsp-slide-box .lsp-none { font-size: 16px; }
.lsp-slide-why { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lsp-slide-why li { display: grid; grid-template-columns: 24px 1fr; font-size: 18px; font-weight: 700; color: var(--lsp-ink); line-height: 1.4; }
.lsp-slide-why li small { display: block; font-size: 15px; font-weight: 400; color: var(--lsp-text); }
.lsp-slide-why li.ng, .lsp-slide-why li.ng .mark { color: var(--lsp-err); }
.lsp-slide-why li.ok .mark { color: #0b7a3a; }
.lsp-slide-why li.stop .mark { color: var(--lsp-warn); }
.lsp-slide-foot { position: absolute; right: 40px; bottom: 14px; font-size: 13px; color: var(--lsp-muted); }

/* ---------- 3画面（①ユーザーが見る画面 ②裏側の処理 ③CVまでの道筋） ----------
   幅に合わせて 3列 → 2列（①の右に②③を縦に）→ 1列 と組み替える。文字は小さくしない */
.lsp { container-type: inline-size; }
.lsp-stage.three { display: grid; grid-template-columns: 380px minmax(300px, 1fr) minmax(300px, 1fr); gap: 16px; align-items: start; padding: 16px; }
.lsp-pane { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.lsp-pane-head { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--lsp-ink); letter-spacing: .02em; }
.lsp-pane-head .no { display: inline-flex; align-items: center; justify-content: center; font-size: 17px; color: var(--lsp-primary); }
.lsp-stage.three .lsp-phone { align-self: center; }
.lsp-stage.three .lsp-side { width: auto; flex: none; }
@container (max-width: 1060px) {
  .lsp-stage.three { grid-template-columns: 380px minmax(0, 1fr); }
  .lsp-stage.three .p1 { grid-row: span 2; }
}
@container (max-width: 760px) {
  .lsp-stage.three { grid-template-columns: minmax(0, 1fr); }
  .lsp-stage.three .p1 { grid-row: auto; }
}

/* ③ CVまでの道筋 */
.lsp-journey { background: #fff; border: 1px solid var(--lsp-line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.lsp-jgoal { font-size: 13px; color: var(--lsp-muted); }
.lsp-jgoal b { color: var(--lsp-ink); font-size: 14.5px; }
.lsp-jbanner { font-size: 13px; font-weight: 700; border-radius: 8px; padding: 6px 10px; }
.lsp-jbanner.ng { background: #fbe5e2; color: var(--lsp-err); }
.lsp-jbanner.ok { background: #e3f4e8; color: #0b7a3a; }
.lsp-jnext { background: #eef4ff; border: 1px solid #cfdcf5; border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; }
.lsp-jn-k { font-size: 11.5px; font-weight: 700; color: #2a6fd6; letter-spacing: .04em; }
.lsp-jn-t { font-size: 13px; font-weight: 700; color: var(--lsp-ink); font-variant-numeric: tabular-nums; }
.lsp-jn-w { font-size: 13.5px; color: var(--lsp-text); }
/* フローチャート（START・施策の四角・分岐のひし形・矢印・GOAL） */
.lsp-fc-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.lsp-fc-tools button { border: 1px solid var(--lsp-line); background: #fff; color: var(--lsp-ink); border-radius: 8px; padding: 2px 9px; font-size: 12.5px; font-weight: 700; }
.lsp-fc-tools .lsp-check { margin: 0; }
.lsp-fc-z { font-size: 12px; min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; color: var(--lsp-text); }
.lsp-fc-scroll { overflow: auto; border-radius: 10px; background: #f6f7fa; padding: 14px 8px; }
.lsp-fc { display: flex; flex-direction: column; align-items: center; min-width: 300px; }
.lsp-fc-row { display: flex; flex-direction: column; align-items: center; width: 100%; }
.lsp-fc-arrow { position: relative; width: 2px; height: 18px; margin-bottom: 7px; background: #b3bac8; flex: 0 0 auto; }
.lsp-fc-arrow::after { content: ""; position: absolute; left: -5px; bottom: -7px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid #b3bac8; }
.lsp-fc-arrow.on { background: var(--lsp-primary); }
.lsp-fc-arrow.on::after { border-top-color: var(--lsp-primary); }
.lsp-fc-line { width: 2px; height: 10px; background: #b3bac8; }
.lsp-fc-line.on { background: var(--lsp-primary); }

.lsp-fc-node { position: relative; width: min(260px, 100%); text-align: left; border: 1.5px solid #c9cfda; background: #fff; border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; color: var(--lsp-text); box-shadow: 0 1px 2px rgba(20, 24, 40, .06); }
.lsp-fc-node:hover { border-color: var(--lsp-primary); }
.lsp-fc-title { font-size: 13.5px; font-weight: 700; color: var(--lsp-ink); line-height: 1.4; }
.lsp-fc-prev { font-size: 12px; color: #555c6b; line-height: 1.45; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.lsp-fc-meta { display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 11px; color: var(--lsp-muted); }
.lsp-fc-meta .ok { color: #0b7a3a; font-weight: 700; }
.lsp-fc-meta .lane { color: var(--lsp-primary); font-weight: 700; }
.lsp-fc-tag { align-self: flex-start; font-size: 10.5px; font-weight: 900; letter-spacing: .1em; border-radius: 4px; padding: 0 6px; background: #fff; }
.lsp-fc-node.start { background: var(--lsp-primary); border-color: var(--lsp-primary); }
.lsp-fc-node.start .lsp-fc-tag { color: var(--lsp-primary); }
.lsp-fc-node.goal { background: #d9661f; border-color: #d9661f; }
.lsp-fc-node.goal .lsp-fc-tag { color: #d9661f; }
.lsp-fc-node.start .lsp-fc-title, .lsp-fc-node.goal .lsp-fc-title { color: #fff; }
.lsp-fc-node.start .lsp-fc-prev, .lsp-fc-node.goal .lsp-fc-prev, .lsp-fc-node.start .lsp-fc-meta, .lsp-fc-node.goal .lsp-fc-meta, .lsp-fc-node.start .lsp-fc-meta .ok, .lsp-fc-node.goal .lsp-fc-meta .ok { color: rgba(255, 255, 255, .9); }
.lsp-fc-node.passed:not(.start):not(.goal) { border-color: var(--lsp-primary); }
.lsp-fc-node.lane { border: 2px dashed var(--lsp-primary); }
.lsp-fc-node.skipped, .lsp-fc-node.other { opacity: .5; }
.lsp-fc-here { position: absolute; top: -10px; right: -6px; z-index: 2; background: var(--lsp-accent); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; white-space: nowrap; box-shadow: 0 0 0 3px rgba(6, 199, 85, .22); }
.lsp-fc-node:has(> .lsp-fc-here) { box-shadow: 0 0 0 3px rgba(6, 199, 85, .35); opacity: 1; }

.lsp-fc-dia { position: relative; width: 210px; height: 84px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; }
.lsp-fc-dia::before, .lsp-fc-dia::after { content: ""; position: absolute; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.lsp-fc-dia::before { inset: 0; background: #d9b34a; }
.lsp-fc-dia::after { inset: 2px 3px; background: #fff8e1; }
.lsp-fc-dia.passed::before { background: var(--lsp-primary); }
.lsp-fc-dia.passed::after { background: #f1f3fa; }
.lsp-fc-dia > span:first-child { position: relative; z-index: 1; max-width: 136px; text-align: center; font-size: 13px; font-weight: 700; line-height: 1.35; color: #5c4400; }
.lsp-fc-dia.passed > span:first-child { color: var(--lsp-ink); }
.lsp-fc-dia .lsp-fc-here { top: 2px; right: 6px; }

/* 分岐の行き先：上下の横線は、等幅の列の中心から中心まで */
.lsp-fc-branches { --n: 2; position: relative; display: flex; width: 100%; }
.lsp-fc-branches::before, .lsp-fc-branches.merge::after { content: ""; position: absolute; height: 2px; background: #b3bac8; left: calc(100% / var(--n) / 2); right: calc(100% / var(--n) / 2); }
.lsp-fc-branches::before { top: 0; }
.lsp-fc-branches.merge::after { bottom: 0; }
.lsp-fc-branch { flex: 1 1 0; min-width: 96px; padding: 0 4px; display: flex; flex-direction: column; align-items: center; }
.lsp-fc-branch::before, .lsp-fc-branches.merge .lsp-fc-branch::after { content: ""; width: 2px; background: #b3bac8; }
.lsp-fc-branch::before { flex: 0 0 12px; }
.lsp-fc-branches.merge .lsp-fc-branch::after { flex: 1 0 14px; }
.lsp-fc-branch.on::before, .lsp-fc-branches.merge .lsp-fc-branch.on::after { background: var(--lsp-primary); }
.lsp-fc-branch .lsp-fc-node { width: 100%; }
.lsp-fc-elabel { font-size: 11.5px; font-weight: 700; background: #fff; border: 1px solid #c9cfda; border-radius: 999px; padding: 0 8px; margin: 0 0 6px; color: var(--lsp-ink); white-space: nowrap; }
.lsp-fc-branch.on .lsp-fc-elabel { border-color: var(--lsp-primary); color: var(--lsp-primary); }

/* 追加候補（未採用・表示のみ）は点線 */
.lsp-fc-opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 6px; max-width: 260px; }
.lsp-fc-opts-k { width: 100%; text-align: center; font-size: 10.5px; font-weight: 700; color: var(--lsp-muted); letter-spacing: .04em; }
.lsp-fc-opt { border: 1.5px dashed #98a1b4; background: #fbfbfd; color: #4b5468; border-radius: 8px; font-size: 11.5px; padding: 2px 8px; }
.lsp-fc-opt:hover { border-color: var(--lsp-primary); color: var(--lsp-ink); }
.lsp-fc-opt i { font-style: normal; margin-left: 4px; color: var(--lsp-muted); }
.lsp-fc-optcount { margin-top: 6px; font-size: 11.5px; border: 1.5px dashed #98a1b4; background: #fbfbfd; border-radius: 8px; padding: 1px 8px; color: #4b5468; white-space: nowrap; }
.lsp-fc-optcount:hover { border-color: var(--lsp-primary); }
.lsp-fc-branch .lsp-fc-prev { -webkit-line-clamp: 2; }
.lsp-fc-legend { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 11.5px; color: var(--lsp-muted); }
.lsp-fc-legend b { display: inline-block; width: 16px; height: 10px; border: 1.5px solid #9aa3b5; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.lsp-fc-legend b.dash { border-style: dashed; }

/* 箱を押したときの詳細（デモ全体の上に重ね、画面の外にはみ出さない） */
.lsp-modal { position: fixed; inset: 0; z-index: 50; background: rgba(15, 18, 30, .45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.lsp-modal-box { background: #fff; border-radius: 14px; width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 18px 50px rgba(0, 0, 0, .3); }
.lsp-modal-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--lsp-line); }
.lsp-modal-head h3 { margin: 0; flex: 1; font-size: 16px; color: var(--lsp-ink); }
.lsp-modal-x { border: 0; background: none; font-size: 22px; line-height: 1; color: var(--lsp-muted); padding: 0 4px; }
.lsp-modal-body { overflow: auto; padding: 10px 16px 16px; font-size: 13.5px; }
.lsp-modal-body h4 { margin: 14px 0 6px; font-size: 12.5px; color: var(--lsp-muted); letter-spacing: .04em; }
.lsp-modal-body p { margin: 4px 0; white-space: pre-wrap; }
.lsp-fc-kind { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 7px; background: var(--lsp-soft); color: var(--lsp-ink); white-space: nowrap; }
.lsp-fc-kind.start { background: var(--lsp-primary); color: #fff; }
.lsp-fc-kind.goal { background: #d9661f; color: #fff; }
.lsp-fc-kind.opt { background: #fff; border: 1.5px dashed #98a1b4; color: #4b5468; }
.lsp-fc-content { border: 1px solid var(--lsp-line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.lsp-fc-content .lsp-kv { font-size: 12.5px; }
.lsp-fc-content .lsp-kv dd { font-weight: 400; color: var(--lsp-text); }
.lsp-fc-bubbles { background: var(--lsp-chat); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin: 8px 0; }
.lsp-fc-bubbles .lsp-b { max-width: 100%; }
.lsp-btn-ro { display: block; text-align: center; border-top: 1px solid #eceff4; padding: 8px; color: #2a6fd6; font-weight: 700; font-size: 13px; }
.lsp-btn-ro:first-child { border-top: 0; }
.lsp-btn-ro small { display: block; font-weight: 400; color: var(--lsp-muted); font-size: 11px; }
.lsp-fc-st { font-size: 12.5px; font-weight: 700; }
.lsp-fc-st.ok { color: #0b7a3a; }
.lsp-fc-st.ng { color: var(--lsp-err); }
.lsp-fc-st.none { color: var(--lsp-muted); font-weight: 400; }
.lsp-fc-feas { background: #f5f7fb; border-radius: 8px; padding: 6px 10px; margin: 8px 0; font-size: 12.5px; }
.lsp-fc-feas b { display: block; color: var(--lsp-ink); }
.lsp-fc-note { background: var(--lsp-warn-soft); color: var(--lsp-warn); border-radius: 8px; padding: 6px 10px; margin: 4px 0 8px; font-size: 12.5px; font-weight: 700; }
.lsp-fc-where { font-size: 12.5px; color: var(--lsp-muted); margin: 4px 0; }
.lsp-fc-cases { list-style: none; padding: 0; margin: 8px 0; }
.lsp-fc-cases li { border: 1px solid var(--lsp-line); border-radius: 8px; padding: 6px 10px; margin-bottom: 6px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.lsp-fc-cases li.yes { border-color: var(--lsp-primary); background: #f3f5fb; }
.lsp-fc-cases .who { font-weight: 700; }
.lsp-fc-cases li.yes .who { color: #0b7a3a; }
.lsp-fc-cases li.no .who { color: var(--lsp-err); }
.lsp-fc-q { margin: 6px 0; }
.lsp-fc-q b { display: block; margin-bottom: 2px; }
.lsp-fc-q span { display: inline-block; border: 1px solid var(--lsp-line); border-radius: 999px; padding: 0 10px; margin: 3px 4px 0 0; font-size: 12.5px; }
.lsp-fc-q small { color: var(--lsp-muted); margin-left: 4px; }

/* 資料用 16:9 の3画面版 */
.lsp-slide.three { grid-template-columns: 380px 1fr 1fr; grid-template-rows: auto 1fr; gap: 10px 22px; padding: 18px 28px 34px; }
.lsp-slide.three .lsp-slide-head { grid-column: 1 / -1; }
.lsp-slide.three .lsp-slide-head .acc, .lsp-slide.three .lsp-slide-head .clock { font-size: 20px; }
.lsp-slide.three .lsp-pane { min-height: 0; overflow: hidden; }
.lsp-slide.three .lsp-pane-head { font-size: 16px; }
.lsp-slide.three .lsp-screen { height: 545px; }
.lsp-slide.three .lsp-narr-title { font-size: 19px; }
.lsp-slide.three .lsp-narr-body { font-size: 15px; }
.lsp-slide.three .lsp-slide-box { padding: 10px 14px; }
.lsp-slide.three .lsp-slide-box h4 { font-size: 14px; margin-bottom: 6px; }
.lsp-slide.three .lsp-slide-box .lsp-tag { font-size: 14px; }
.lsp-slide.three .lsp-slide-why li { font-size: 15.5px; }
.lsp-slide.three .lsp-slide-why li small { font-size: 14px; }
.lsp-journey.compact { gap: 8px; padding: 10px 14px; }
.lsp-journey.compact .lsp-jgoal { font-size: 14px; }
.lsp-journey.compact .lsp-jgoal b { font-size: 16px; }
.lsp-journey.compact .lsp-jn-k { font-size: 12.5px; }
.lsp-journey.compact .lsp-jn-t, .lsp-journey.compact .lsp-jn-w { font-size: 14.5px; }
.lsp-journey.compact .lsp-jbanner { font-size: 14px; }
.lsp-journey.compact { flex: 1; min-height: 0; }
.lsp-journey.compact .lsp-fc-scroll { flex: 1; min-height: 0; overflow: hidden; background: none; padding: 10px 0 0; }
.lsp-journey.compact .lsp-fc-title { font-size: 15px; }
.lsp-journey.compact .lsp-fc-meta { font-size: 12px; }
.lsp-journey.compact .lsp-fc-dia > span:first-child { font-size: 14px; }
.lsp-journey.compact .lsp-jn-w { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lsp-journey.compact .lsp-fc-node { flex-direction: row; align-items: center; gap: 6px; padding: 5px 9px; }
.lsp-journey.compact .lsp-fc-meta { display: none; }
.lsp-journey.compact .lsp-fc-tag { align-self: center; }
.lsp-journey.compact .lsp-fc-arrow { height: 9px; margin-bottom: 6px; }
.lsp-journey.compact .lsp-fc-line { height: 6px; }
.lsp-journey.compact .lsp-fc-dia { width: 200px; height: 54px; }
.lsp-journey.compact .lsp-fc-branch::before { flex-basis: 8px; }
.lsp-journey.compact .lsp-fc-branches.merge .lsp-fc-branch::after { flex-basis: 8px; }
.lsp-journey.compact .lsp-fc-elabel { margin-bottom: 4px; font-size: 12.5px; }
.lsp-journey.compact .lsp-fc-branch .lsp-fc-title { font-size: 13.5px; }
.lsp-journey.compact .lsp-fc-optcount { margin-top: 3px; }
.lsp-fc-gap { margin: 2px 0 6px; padding: 1px 10px; font-size: 12.5px; font-weight: 700; color: var(--lsp-muted); background: #fff; border: 1px dashed #c3c9d4; border-radius: 999px; }

/* はじめての人向けの使い方 */
.lsp-help { display: flex; align-items: flex-start; gap: 10px; background: #eef4ff; border: 1px solid #cfdcf5; border-radius: 10px; padding: 8px 12px; font-size: 12.5px; color: var(--lsp-text); }
.lsp-help > b { flex: 0 0 auto; color: #2a6fd6; padding-top: 1px; }
.lsp-help ol { margin: 0; padding-left: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 2px 16px; flex: 1; }
.lsp-help li b { color: var(--lsp-ink); }
/* 3画面の③は枠の中でスクロールし、「現在ここ」を見える位置に出す */
.lsp-stage.three .lsp-fc-scroll { max-height: min(76vh, 900px); }

/* 資料用16:9の③：段が多い案件でも読める大きさを保つ（箱は1行・分岐の行き先は1行・候補の件数は出さない） */
.lsp-journey.compact .lsp-jgoal { display: none; }
.lsp-journey.compact .lsp-fc-node { width: 100%; }
.lsp-journey.compact .lsp-fc-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lsp-journey.compact .lsp-fc-branch .lsp-fc-node { padding: 3px 6px; }
.lsp-journey.compact .lsp-fc-branch .lsp-fc-title { font-size: 12.5px; }
.lsp-journey.compact .lsp-fc-optcount { display: none; }
.lsp-journey.compact .lsp-fc-dia { height: 46px; }
.lsp-journey.compact .lsp-fc-elabel { margin-bottom: 3px; }

/* =====================================================================
   2026-10-28 デザインの整理：営業先で見せる画面として、余白・カード・色の意味をそろえる
   色の意味（③の時系列・②で共通）：操作=青／LINEメッセージ=緑／タグ・状態=紫／シナリオ=灰／CV=橙／停止=赤
   ===================================================================== */
.lsp {
  --k-op: #2563c9;
  --k-msg: #079447;
  --k-state: #7a45b8;
  --k-flow: #5b6577;
  --k-cv: #d0611b;
  --k-stop: #c0392b;
  --lsp-bg: #f3f5f9;
  --lsp-radius: 14px;
  --lsp-shadow: 0 1px 2px rgba(20, 24, 40, .05), 0 4px 14px rgba(20, 24, 40, .05);
  background: var(--lsp-bg);
}
.lsp-stage.three { gap: 18px; padding: 18px; }
.lsp-pane-head { font-size: 15px; padding: 0 2px; }
.lsp-pane-head .no { width: 26px; height: 26px; border-radius: 50%; background: var(--lsp-primary); color: #fff; font-size: 14px; }
.lsp-card-side, .lsp-narr, .lsp-where, .lsp-jsec, .lsp-tl { box-shadow: var(--lsp-shadow); }
.lsp-bar { box-shadow: 0 1px 0 var(--lsp-line), 0 4px 12px rgba(20, 24, 40, .04); }
.lsp-bar button.primary { padding: 5px 14px; }
.lsp-playstate { font-weight: 700; color: var(--lsp-ink); background: #fff7e8; border: 1px solid #f3dcb4; border-radius: 8px; padding: 3px 10px; }
.lsp-playstate:empty { display: none; }

/* ① スマホ：文字を少し大きく、押せるものをはっきり */
.lsp-b { font-size: 14px; }
.lsp-btns button { padding: 11px 10px; font-size: 13.5px; }
.lsp-chips button { padding: 7px 16px; font-size: 14px; }
.lsp-quick { box-shadow: 0 -4px 12px rgba(20, 24, 40, .06); }
.lsp-quick-q { color: #2a6fd6; }
.lsp-hl { position: relative; animation: lsp-pulse 1.6s ease-in-out infinite; outline: 3px solid #f5a623 !important; outline-offset: 2px; border-radius: 10px; }
@keyframes lsp-pulse { 50% { outline-color: rgba(245, 166, 35, .25); } }
@media (prefers-reduced-motion: reduce) { .lsp-hl { animation: none; } }
.lsp-start-main button { padding: 14px 14px 12px; font-size: 15px; border-width: 1.5px; box-shadow: 0 1px 2px rgba(20, 24, 40, .05); }
.lsp-start-main button .no { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--lsp-primary); color: #fff; font-size: 12px; margin-right: 8px; vertical-align: 1px; }
.lsp-start-main button:hover { border-color: var(--lsp-primary); }
.lsp-start-more { margin-top: 18px; font-size: 12.5px; color: var(--lsp-muted); }
.lsp-start-more summary { cursor: pointer; padding: 6px 2px; font-weight: 700; }
.lsp-start-more button { font-size: 13px; padding: 9px 12px; }

/* ② 裏側：状態のタイル・シナリオのカード */
.lsp-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lsp-tile { border: 1px solid var(--lsp-line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; min-width: 0; background: #fbfcfe; }
.lsp-tile .k { font-size: 11px; font-weight: 700; color: var(--lsp-muted); letter-spacing: .04em; }
.lsp-tile b { font-size: 14.5px; color: var(--lsp-ink); line-height: 1.35; overflow-wrap: anywhere; }
.lsp-tile small { font-size: 11.5px; color: var(--lsp-muted); line-height: 1.4; overflow-wrap: anywhere; }
.lsp-tile.ok { border-color: #bfe3cc; background: #f1faf4; }
.lsp-tile.ok b { color: #0b7a3a; }
.lsp-tile.ng { border-color: #f1c4bd; background: #fdf1ef; }
.lsp-tile.ng b { color: var(--lsp-err); }
.lsp-tile.next { border-color: #cfdcf5; background: #f3f7ff; }
.lsp-answers { list-style: none; margin: 0; padding: 0; }
.lsp-answers li { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--lsp-soft); font-size: 13px; }
.lsp-answers li span { color: var(--lsp-muted); }
.lsp-flows.act { display: flex; flex-direction: column; gap: 6px; }
.lsp-flows.act li.lsp-fl { display: block; border: 1px solid var(--lsp-line); border-left: 4px solid var(--k-msg); border-radius: 10px; padding: 7px 10px; }
.lsp-fl-h { display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
.lsp-fl-h b { color: var(--lsp-ink); }
.lsp-fl-kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 4px 0 0; font-size: 12.5px; }
.lsp-fl-kv dt { color: var(--lsp-muted); }
.lsp-fl-kv dd { margin: 0; color: var(--lsp-text); }
.lsp-fl-kv dd.strong { font-weight: 700; color: var(--lsp-ink); font-variant-numeric: tabular-nums; }
.lsp-done { margin-top: 8px; font-size: 12.5px; }
.lsp-done summary { cursor: pointer; color: var(--lsp-muted); font-weight: 700; padding: 4px 0; }
.lsp-hint.top { margin: 0 0 8px; }
.lsp-tabs button { font-size: 13px; }

/* ③ 上：現在地と次にすること */
.lsp-journey { background: none; border: 0; padding: 0; gap: 12px; }
.lsp-where { background: #fff; border: 1px solid var(--lsp-line); border-radius: var(--lsp-radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.lsp-wh-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lsp-wh-who { font-size: 16px; font-weight: 700; color: var(--lsp-ink); }
.lsp-wh-badge { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: var(--lsp-soft); color: var(--lsp-muted); }
.lsp-wh-badge.manual { background: #eaf1ff; color: #2563c9; }
.lsp-wh-cv { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--lsp-muted); }
.lsp-wh-cv.ok { color: #0b7a3a; background: #e3f4e8; border-radius: 999px; padding: 1px 10px; }
.lsp-wh-stage { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.lsp-wh-stage .k { font-size: 11.5px; font-weight: 700; color: #fff; background: var(--lsp-accent); border-radius: 999px; padding: 1px 9px; }
.lsp-wh-stage b { font-size: 15px; color: var(--lsp-ink); }
.lsp-wh-stage small { font-size: 12px; color: var(--lsp-muted); }
.lsp-guide { display: flex; flex-direction: column; gap: 3px; border-radius: 10px; padding: 9px 12px; background: #fff7e8; border: 1.5px solid #f5a623; }
.lsp-guide-k { font-size: 12px; font-weight: 700; color: #a15c00; display: flex; align-items: center; gap: 6px; }
.lsp-guide-k i { font-style: normal; font-size: 11px; background: #fff; border: 1px solid currentColor; border-radius: 999px; padding: 0 7px; }
.lsp-guide-t { font-size: 14px; font-weight: 700; color: var(--lsp-ink); line-height: 1.5; }
.lsp-guide.g-script, .lsp-guide.g-wait { background: #f3f7ff; border-color: #9db8ea; }
.lsp-guide.g-script .lsp-guide-k, .lsp-guide.g-wait .lsp-guide-k { color: #2563c9; }
.lsp-guide.g-done { background: #effaf3; border-color: #7cc79a; }
.lsp-guide.g-done .lsp-guide-k { color: #0b7a3a; }
.lsp-guide.g-stopped { background: #fdf1ef; border-color: #e7a59b; }
.lsp-guide.g-stopped .lsp-guide-k { color: var(--lsp-err); }
.lsp-jnext { background: #f7f8fb; border-color: var(--lsp-line); }
.lsp-jnext .lsp-jn-k { color: var(--lsp-muted); }

/* ③ 中：フロー */
.lsp-jsec { background: #fff; border: 1px solid var(--lsp-line); border-radius: var(--lsp-radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.lsp-jsec-h { font-size: 14px; font-weight: 700; color: var(--lsp-ink); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.lsp-jsec-h small { font-size: 11.5px; font-weight: 400; color: var(--lsp-muted); }
.lsp-stage.three .lsp-fc-scroll { max-height: min(44vh, 520px); }
.lsp-fc-legend b.on { border-color: var(--lsp-primary); background: #eef1fa; }
.lsp-fc-legend b.off { opacity: .45; }

/* ③ 下：全ユーザーの時系列 */
.lsp-tl { background: #fff; border: 1px solid var(--lsp-line); border-radius: var(--lsp-radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.lsp-tl-headbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lsp-tl-title { font-size: 14px; font-weight: 700; color: var(--lsp-ink); margin-right: auto; }
.lsp-tl-headbar .lsp-group button { border: 1px solid var(--lsp-line); background: #fff; color: var(--lsp-ink); border-radius: 8px; padding: 2px 10px; font-size: 12.5px; font-weight: 700; }
.lsp-tl-headbar .lsp-group button.on { background: var(--lsp-primary); border-color: var(--lsp-primary); color: #fff; }
.lsp-tl-headbar .lsp-check { margin: 0; font-size: 12px; }
.lsp-tl-next { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; background: #f7f8fb; border: 1px dashed #b9c1cf; border-radius: 10px; padding: 7px 10px; font-size: 13px; }
.lsp-tl-next .k { font-size: 11.5px; font-weight: 700; color: var(--lsp-muted); }
.lsp-tl-next b { font-variant-numeric: tabular-nums; color: var(--lsp-ink); }
.lsp-tl-next span:not(.k) { color: var(--lsp-text); }
.lsp-tl-legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11.5px; color: var(--lsp-muted); }
.lsp-tl-legend .k-op { color: var(--k-op); }
.lsp-tl-legend .k-msg { color: var(--k-msg); }
.lsp-tl-legend .k-state { color: var(--k-state); }
.lsp-tl-legend .k-flow { color: var(--k-flow); }
.lsp-tl-legend .k-cv { color: var(--k-cv); }
.lsp-tl-legend .k-stop { color: var(--k-stop); }
.lsp-tl-legend .mine { font-weight: 700; color: var(--lsp-ink); }
.lsp-tl-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.lsp-tl-scroll { max-height: min(56vh, 640px); overflow: auto; padding-right: 2px; }
.lsp-tl-day { position: sticky; top: 0; z-index: 1; background: #fff; font-size: 12px; font-weight: 700; color: var(--lsp-muted); padding: 6px 2px 2px; border-bottom: 1px solid var(--lsp-soft); }
.lsp-tl-nowline { margin: 10px 0 6px; border-top: 2px solid var(--lsp-accent); }
.lsp-tl-nowline span { position: relative; top: -11px; background: var(--lsp-accent); color: #fff; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 1px 10px; margin-left: 8px; }
.lsp-tl-row { border: 1px solid transparent; border-left: 4px solid var(--k-flow); border-radius: 8px; background: #fafbfc; }
.lsp-tl-row.k-op { border-left-color: var(--k-op); }
.lsp-tl-row.k-msg { border-left-color: var(--k-msg); }
.lsp-tl-row.k-state { border-left-color: var(--k-state); }
.lsp-tl-row.k-cv { border-left-color: var(--k-cv); }
.lsp-tl-row.k-stop { border-left-color: var(--k-stop); }
.lsp-tl-row:not(.mine) { opacity: .62; }
.lsp-tl-row:not(.mine):hover { opacity: 1; }
.lsp-tl-row.mine { background: #fff; border-color: var(--lsp-line); box-shadow: 0 1px 3px rgba(20, 24, 40, .07); }
.lsp-tl-row.now { box-shadow: 0 0 0 2px rgba(6, 199, 85, .45); opacity: 1; }
.lsp-tl-row.future { background: repeating-linear-gradient(135deg, #fff, #fff 6px, #f6f7fa 6px, #f6f7fa 12px); border-style: dashed; border-left-style: solid; }
.lsp-tl-row.future:not(.mine) { opacity: .5; }
.lsp-tl-head { display: grid; grid-template-columns: 50px 20px 1fr; gap: 6px; align-items: start; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; color: var(--lsp-text); }
.lsp-tl-time { font-size: 12.5px; font-weight: 700; color: var(--lsp-ink); font-variant-numeric: tabular-nums; display: flex; flex-direction: column; line-height: 1.3; }
.lsp-tl-time small { font-size: 10.5px; font-weight: 700; color: var(--lsp-muted); }
.lsp-tl-row.now .lsp-tl-time small { color: #0b7a3a; }
.lsp-tl-kind { font-size: 13px; line-height: 1.5; text-align: center; }
.lsp-tl-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; font-size: 12.5px; line-height: 1.5; }
.lsp-tl-who { font-size: 11.5px; color: var(--lsp-muted); }
.lsp-tl-row.mine .lsp-tl-who { color: var(--lsp-primary); font-weight: 700; }
.lsp-tl-main > b { font-size: 13.5px; color: var(--lsp-ink); }
.lsp-tl-f, .lsp-tl-b { display: block; overflow-wrap: anywhere; }
.lsp-tl-f i, .lsp-tl-b i { font-style: normal; display: inline-block; font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 1px; }
.lsp-tl-f i { background: #e6f5ec; color: #0b7a3a; }
.lsp-tl-b i { background: #eceff5; color: #4b5468; }
.lsp-tl-b { color: #4b5468; }
.lsp-tl-f .none { color: var(--lsp-muted); }
.lsp-tl-main .more { margin-left: 6px; font-size: 11px; color: #2563c9; font-weight: 700; }
.lsp-tl-items { list-style: none; margin: 0; padding: 2px 10px 8px 84px; font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
.lsp-tl-items li span { display: inline-block; width: 18px; }
.lsp-tl-items li.minor { color: var(--lsp-muted); }
.lsp-tl-switch { margin: 0 10px 8px 84px; border: 1px solid var(--lsp-primary); background: #fff; color: var(--lsp-primary); border-radius: 8px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
.lsp-tl-list.hist .lsp-tl-row { opacity: 1; }

/* 資料用16:9の③：現在地・次にすること・フロー・直近の出来事だけ */
.lsp-journey.compact { gap: 6px; }
.lsp-journey.compact .lsp-where { padding: 8px 12px; gap: 5px; }
.lsp-journey.compact .lsp-wh-who { font-size: 15px; }
.lsp-journey.compact .lsp-guide { padding: 6px 10px; }
.lsp-journey.compact .lsp-guide-t { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.lsp-journey.compact .lsp-jsec { flex: 1; min-height: 0; padding: 6px 10px; }
.lsp-journey.compact .lsp-tl { padding: 6px 10px; gap: 4px; }
.lsp-journey.compact .lsp-tl-title { font-size: 13px; }
.lsp-journey.compact .lsp-tl-row .lsp-tl-b { display: none; }
.lsp-journey.compact .lsp-tl-head { padding: 3px 6px; grid-template-columns: 44px 18px 1fr; }
.lsp-journey.compact .lsp-tl-main { font-size: 13px; }
.lsp-journey.compact .lsp-tl-f { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.lsp-journey.compact .lsp-tl-next { padding: 4px 8px; font-size: 13px; }
.lsp-journey.compact .lsp-tl-row:not(.mine) { opacity: .75; }

/* 3画面の③：時系列を見ようと下へスクロールしても、現在地と次にすることは上に残す */
.lsp-stage.three .lsp-where { position: sticky; top: calc(var(--lsp-bar-h, 0px) + 6px); z-index: 4; }
.lsp-stage.three .lsp-fc-scroll { max-height: min(40vh, 480px); }
/* 時系列は、上に残る現在地カードの下にちょうど収まる高さにする（ページを下まで送ったとき全部見える） */
.lsp-tl-nowline { border-top: 0; margin: 8px 0 4px; }
.lsp-tl-nowline span { position: static; display: block; margin: 0; border-radius: 8px; padding: 3px 10px; line-height: 1.45; }

/* 資料用16:9の③：道筋は1行ずつ（縮小しない） */
.lsp-strip { list-style: none; margin: 0; padding: 4px 0; display: flex; flex-direction: column; gap: 4px; }
.lsp-strip li { position: relative; display: flex; align-items: center; gap: 8px; border: 1.5px solid #d5dae3; border-radius: 9px; padding: 5px 10px; font-size: 14.5px; background: #fff; color: var(--lsp-muted); }
.lsp-strip li .m { width: 16px; text-align: center; font-weight: 900; }
.lsp-strip li .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lsp-strip li.done { border-color: var(--lsp-primary); color: var(--lsp-ink); }
.lsp-strip li.done .m { color: #0b7a3a; }
.lsp-strip li.current { border-color: var(--lsp-accent); color: var(--lsp-ink); font-weight: 700; box-shadow: 0 0 0 3px rgba(6, 199, 85, .22); }
.lsp-strip li.current .m { color: var(--lsp-accent); }
.lsp-strip li.start { background: var(--lsp-primary); border-color: var(--lsp-primary); color: #fff; }
.lsp-strip li.start .m { color: #fff; }
.lsp-strip li.goal { border-color: #d9661f; }
.lsp-strip li.goal .g { font-size: 11px; font-weight: 900; color: #fff; background: #d9661f; border-radius: 4px; padding: 0 6px; }
.lsp-strip li.goal.done, .lsp-strip li.goal.current { background: #d9661f; color: #fff; }
.lsp-strip li .lsp-fc-here { position: static; box-shadow: none; }
.lsp-strip li.gap { border: 0; padding: 0 10px; font-size: 12.5px; color: var(--lsp-muted); background: none; }
.lsp-journey.compact .lsp-jsec { flex: 0 0 auto; }
/* 16:9では現在地は道筋の「現在ここ」、CVはGOALの行で分かるので、上のカードは名前と次にすることだけ */
.lsp-journey.compact .lsp-wh-stage, .lsp-journey.compact .lsp-wh-cv { display: none; }
.lsp-journey.compact .lsp-strip { gap: 3px; padding: 2px 0; }
.lsp-journey.compact .lsp-strip li { padding: 3px 10px; }
.lsp-slide.three .lsp-pane.p3 { gap: 6px; }
/* ②：幅が狭いときも、タブの文字とタイルが縦に折れないように */
.lsp-tabs { overflow-x: auto; }
.lsp-tabs button { white-space: nowrap; flex: 1 0 auto; padding: 9px 8px; }
.lsp-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.lsp-tile.next { grid-column: 1 / -1; }

.lsp-ctrls button.done { background: #f1faf4; border-color: #bfe3cc; color: #0b7a3a; opacity: 1; }

/* 上の帯：主な操作（次の出来事・戻る・再生）を大きく、細かい操作は開いたときだけ。各段の役割は上の短い文で */
.lsp-bar { gap: 8px; padding: 10px 18px; }
.lsp-bar-sec { display: flex; flex-direction: column; gap: 4px; }
.lsp-cap { font-size: 12px; color: var(--lsp-muted); line-height: 1.4; }
.lsp-bar-row.main { gap: 8px; }
.lsp-bar .lsp-clock { font-size: 19px; min-width: 128px; }
.lsp-bar .lsp-next-btn { font-size: 15px; padding: 7px 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(31, 40, 90, .25); }
.lsp-bar .lsp-back-btn, .lsp-bar .lsp-play-btn { font-size: 13.5px; padding: 6px 12px; border-radius: 10px; }
.lsp-bar .lsp-all { border-style: dashed; }
.lsp-now-who { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: 6px; padding: 3px 10px; border-radius: 10px; background: #f6f7fa; border: 1px solid var(--lsp-line); font-size: 12.5px; }
.lsp-now-who .k { color: var(--lsp-muted); font-weight: 700; font-size: 11.5px; }
.lsp-now-who b { color: var(--lsp-ink); }
.lsp-now-mode { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 0 8px; background: #fff; border: 1px solid var(--lsp-line); color: var(--lsp-muted); }
.lsp-now-mode.script { color: #4b5468; }
.lsp-now-mode.manual { color: #2563c9; border-color: #b9cdf3; }
.lsp-now-mode.play { color: #0b7a3a; border-color: #9fd8b3; background: #effaf3; }
.lsp-bar .lsp-view button.on { background: var(--lsp-primary); color: #fff; }
.lsp-bar-more { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border-radius: 10px; background: #f7f8fb; border: 1px solid var(--lsp-line); }
.lsp-bar .lsp-playstate { align-self: flex-start; font-size: 12.5px; }

/* ③「いま起きたこと」：表側＝緑、裏側＝灰で分け、表示中の人を先頭・強調。ほかの人は控えめ */
.lsp-nowcard { background: #fff; border: 1.5px solid var(--lsp-accent); border-radius: var(--lsp-radius); padding: 10px 12px; box-shadow: var(--lsp-shadow); display: flex; flex-direction: column; gap: 6px; }
.lsp-nowcard.empty { border-color: var(--lsp-line); }
.lsp-nowcard-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.lsp-nowcard-h b { font-size: 14px; color: #0b7a3a; }
.lsp-nowcard-h span { font-size: 12.5px; color: var(--lsp-muted); font-variant-numeric: tabular-nums; }
.lsp-nowcard-h button { margin-left: auto; border: 0; background: none; color: #2563c9; font-size: 12px; font-weight: 700; padding: 0; }
.lsp-nowcard ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow: auto; }
.lsp-nowcard li { border-radius: 10px; padding: 7px 9px; border: 1px solid var(--lsp-line); border-left: 4px solid var(--k-flow); background: #fafbfc; display: flex; flex-direction: column; gap: 3px; }
.lsp-nowcard li.k-op { border-left-color: var(--k-op); }
.lsp-nowcard li.k-msg { border-left-color: var(--k-msg); }
.lsp-nowcard li.k-state { border-left-color: var(--k-state); }
.lsp-nowcard li.k-cv { border-left-color: var(--k-cv); }
.lsp-nowcard li.k-stop { border-left-color: var(--k-stop); }
.lsp-nowcard li.mine { background: #fff; box-shadow: 0 1px 4px rgba(20, 24, 40, .08); }
.lsp-nowcard li.other { opacity: .78; }
.lsp-nc-who { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; }
.lsp-nc-who b { color: var(--lsp-ink); }
.lsp-nc-who .t { font-weight: 700; color: var(--lsp-text); }
.lsp-nc-who .tag { font-size: 10.5px; font-weight: 700; color: #fff; background: var(--lsp-primary); border-radius: 999px; padding: 0 7px; }
.lsp-nc-who .lsp-tl-switch { margin: 0 0 0 auto; }
.lsp-nc-f, .lsp-nc-b { display: grid; grid-template-columns: 22px 1fr; gap: 4px; font-size: 12.5px; line-height: 1.5; border-radius: 6px; padding: 3px 6px; overflow-wrap: anywhere; }
.lsp-nc-f { background: #eef8f1; color: #14532d; }
.lsp-nc-b { background: #f1f3f7; color: #4b5468; }
.lsp-nc-f.none { background: #f6f7fa; color: var(--lsp-muted); }
.lsp-nc-f i, .lsp-nc-b i { font-style: normal; font-size: 10.5px; font-weight: 700; text-align: center; border-radius: 4px; align-self: start; margin-top: 2px; }
.lsp-nc-f i { background: #0b7a3a; color: #fff; }
.lsp-nc-b i { background: #6b7280; color: #fff; }
.lsp-nc-f .more, .lsp-nc-b .more { margin-left: 6px; font-size: 11px; font-weight: 700; color: #2563c9; }
/* 時系列の行でも、表側＝緑・裏側＝灰の地色で分ける */
.lsp-tl-f { background: #eef8f1; border-radius: 5px; padding: 1px 5px; }
.lsp-tl-b { background: #f1f3f7; border-radius: 5px; padding: 1px 5px; margin-top: 2px; }
.lsp-tl-f i { background: #0b7a3a; color: #fff; }
.lsp-tl-b i { background: #6b7280; color: #fff; }

/* 16:9（投影）では帯を1段に */

.lsp-bar.compact .lsp-cap { display: none; }
.lsp-bar.compact .lsp-playstate { font-size: 12px; padding: 1px 8px; }
.lsp-userpick { font-weight: 700; max-width: 320px; }

/* カルーセル（横に並ぶカード）。1枚ずつ送り、次のカードの端を見せる */
.lsp-row.bot .lsp-col:has(> .lsp-car) { flex: 1 1 auto; max-width: calc(100% - 40px); min-width: 0; }
.lsp-b.lsp-car { background: transparent; padding: 0; border-radius: 0; white-space: normal; }
.lsp-car-view { overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; border-radius: 14px; }
.lsp-car-view:active { cursor: grabbing; }
.lsp-car-track { --cw: 214px; display: flex; gap: 8px; transform: translateX(calc(var(--i, 0) * (var(--cw) + 8px) * -1 + var(--dx, 0px))); transition: transform .28s ease; }
.lsp-car-card { flex: 0 0 var(--cw); background: #fff; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); opacity: .72; transition: opacity .2s; }

.lsp-car-img { position: relative; background: #e9eef3; }
.lsp-car-img img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; pointer-events: none; }
.lsp-car-badge { position: absolute; left: 6px; top: 6px; background: rgba(0, 0, 0, .62); color: #fff; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
.lsp-car-title { padding: 8px 10px 2px; font-weight: 700; font-size: 13.5px; line-height: 1.4; }
.lsp-car-facts { margin: 4px 10px 6px; display: grid; gap: 2px; font-size: 12px; line-height: 1.45; }
.lsp-car-facts div { display: grid; grid-template-columns: 4.6em 1fr; gap: 4px; }
.lsp-car-facts dt { color: #6b7380; }
.lsp-car-facts dd { margin: 0; color: #1d232c; }
.lsp-car-body { padding: 0 10px 8px; font-size: 12px; color: #444; }
.lsp-car-card .lsp-btns { margin-top: auto; }
.lsp-car-card .lsp-btns button { padding: 9px 8px; font-size: 13px; }
.lsp-car-nav { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.lsp-car-nav .lsp-car-prev, .lsp-car-nav .lsp-car-next { width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .92); color: #1d232c; font-size: 18px; font-weight: 700; line-height: 1; box-shadow: 0 1px 3px rgba(0, 0, 0, .18); cursor: pointer; }
.lsp-car-nav button:disabled { opacity: .35; cursor: default; }
.lsp-car-dots { display: flex; gap: 5px; flex: 1; justify-content: center; }
.lsp-car-dot { width: 8px; height: 8px; padding: 0; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .7); cursor: pointer; }
.lsp-car-dot.on { background: #fff; box-shadow: 0 0 0 2px var(--lsp-primary); }
.lsp-car-count { font-size: 11.5px; font-weight: 700; color: #fff; background: rgba(0, 0, 0, .35); border-radius: 999px; padding: 1px 8px; }
/* 文面確認（③の詳細）では横スクロールで全カードを見せる */
.lsp-car-ro { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.lsp-car-ro .lsp-car-card { --cw: 200px; flex: 0 0 200px; opacity: 1; border: 1px solid var(--lsp-line); }
@media (prefers-reduced-motion: reduce) { .lsp-car-track { transition: none; } }
/* リッチメニューのタブ（2タブ構成など） */
.lsp-menu-grid button.tab { min-height: 34px; font-size: 12px; background: #fff; color: #5b6472; }
.lsp-menu-grid button.tab.on { background: var(--lsp-primary); color: #fff; cursor: default; }
.lsp-menu-grid:has(button.tab) button:not(.tab) { min-height: 52px; }
/* ②：届いたカルーセルと理由 */
.lsp-carw { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lsp-carw li { border: 1px solid var(--lsp-line); border-left: 4px solid var(--lsp-primary); border-radius: 10px; padding: 7px 10px; background: #fff; }
.lsp-carw-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
.lsp-carw-h .t { color: var(--lsp-muted); font-size: 12px; white-space: nowrap; }
.lsp-carw-why { font-size: 12.5px; margin-top: 3px; color: #1d232c; }

.lsp-cvlog { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }

.lsp-cvlog .t { color: var(--lsp-muted); font-size: 12px; }
