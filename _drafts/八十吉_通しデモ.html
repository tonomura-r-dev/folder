<title>八十吉 通しデモ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#F5F6F9; --paper:#FFFFFF; --ink:#1F285A; --text:#2B3044; --muted:#6B7280; --line:#DCE0E8;
    --green:#06C755; --green-ink:#0B7A3A; --green-soft:#E6F8EE;
    --amber:#D9661F; --amber-soft:#FBEEE4; --red:#C0392B; --red-soft:#FBE5E2;
    --chat-bg:#7C9BD0; --bubble-me:#8DE39B; --bubble-you:#FFFFFF; --bubble-text:#1a1a1a;
    --sheet-head:#EEF3FB; --code:#F1F3F7; --node:#FFFFFF; --node-on:#1F285A; --node-on-text:#FFFFFF;
    --rb:#2B7DE9; --rb-soft:#EAF2FD;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141C; --paper:#1B1E29; --ink:#DCE3FF; --text:#E6E8F0; --muted:#9AA0B3; --line:#2E3345;
      --green:#2FD46F; --green-ink:#7BE6A3; --green-soft:#153524;
      --amber:#F08A45; --amber-soft:#3A2416; --red:#F07A6E; --red-soft:#3A1D1A;
      --chat-bg:#3D4F75; --bubble-me:#3E8C52; --bubble-you:#2A2E3D; --bubble-text:#F2F4F8;
      --sheet-head:#232A3D; --code:#232736; --node:#1B1E29; --node-on:#DCE3FF; --node-on-text:#12141C;
      --rb:#6FA8F5; --rb-soft:#1C2A40;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141C; --paper:#1B1E29; --ink:#DCE3FF; --text:#E6E8F0; --muted:#9AA0B3; --line:#2E3345;
    --green:#2FD46F; --green-ink:#7BE6A3; --green-soft:#153524;
    --amber:#F08A45; --amber-soft:#3A2416; --red:#F07A6E; --red-soft:#3A1D1A;
    --chat-bg:#3D4F75; --bubble-me:#3E8C52; --bubble-you:#2A2E3D; --bubble-text:#F2F4F8;
    --sheet-head:#232A3D; --code:#232736; --node:#1B1E29; --node-on:#DCE3FF; --node-on-text:#12141C;
    --rb:#6FA8F5; --rb-soft:#1C2A40;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;font-size:14.5px;line-height:1.6}
  h1,h2,h3{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;color:var(--ink);text-wrap:balance;margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 48px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
  header h1{font-size:21px;font-weight:900}
  header .sub{color:var(--muted);font-size:13px}

  /* pipeline */
  .pipe{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 0 10px;margin-bottom:12px}
  .node{flex:1 0 118px;min-width:118px;position:relative;padding:8px 6px 8px 10px;border:1px solid var(--line);background:var(--node);border-radius:10px;margin-right:14px;font-size:12px;line-height:1.35;transition:background .25s,color .25s}
  .node small{display:block;color:var(--muted);font-size:10.5px;font-weight:500}
  .node b{display:block;color:var(--ink);font-size:12.5px}
  .node:not(:last-child)::after{content:"";position:absolute;right:-11px;top:50%;width:0;height:0;border-left:8px solid var(--line);border-top:6px solid transparent;border-bottom:6px solid transparent;transform:translateY(-50%)}
  .node.on{background:var(--node-on);border-color:var(--node-on)}
  .node.on b,.node.on small{color:var(--node-on-text)}
  .node.done{border-color:var(--green);background:var(--green-soft)}
  .node.done b{color:var(--green-ink)}

  .stage{display:grid;grid-template-columns:320px 1fr 300px;gap:16px;align-items:start}
  @media (max-width:1000px){.stage{grid-template-columns:320px 1fr}.narr{grid-column:1/-1}}
  @media (max-width:700px){.stage{grid-template-columns:1fr}}

  /* phone */
  .phone{background:#111;border-radius:32px;padding:9px;box-shadow:0 10px 30px rgba(0,0,0,.18);margin:0 auto;width:100%;max-width:320px}
  .screen{background:var(--chat-bg);border-radius:24px;overflow:hidden;min-height:520px;display:flex;flex-direction:column}
  .bar{background:var(--paper);color:var(--ink);padding:9px 13px;font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
  .bar .who{font-size:11px;color:var(--muted);font-weight:500}
  .chat{padding:11px 9px;display:flex;flex-direction:column;gap:8px;flex:1}
  .msg{max-width:88%;padding:8px 11px;border-radius:15px;font-size:13px;line-height:1.5;white-space:pre-wrap;color:var(--bubble-text)}
  .msg.you{background:var(--bubble-you);align-self:flex-start;border-top-left-radius:4px}
  .msg.me{background:var(--bubble-me);align-self:flex-end;border-top-right-radius:4px}
  .msg .name{display:block;font-size:11px;opacity:.7;margin-bottom:2px}
  .msg .link{display:block;margin-top:7px;padding:7px 9px;border-radius:9px;background:rgba(0,0,0,.07);font-weight:700;font-size:12px}
  .sys{align-self:center;font-size:11px;color:#fff;background:rgba(0,0,0,.28);padding:3px 10px;border-radius:999px}
  .richmenu{background:var(--paper);display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
  .richmenu div{padding:11px 4px;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink);border-right:1px solid var(--line)}
  .richmenu div:last-child{border-right:0}
  .richmenu div.hot{background:var(--green-soft);color:var(--green-ink)}
  .liff{background:var(--paper);flex:1;padding:11px;display:flex;flex-direction:column;gap:9px;color:var(--text)}
  .liff .date{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14.5px;color:var(--ink)}
  .liff .date span{color:var(--muted);font-weight:500;font-size:11.5px}
  .seats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
  .seat{border:1px solid var(--line);border-radius:11px;padding:7px 9px}
  .seat b{display:block;font-size:21px;line-height:1.1;font-family:"Zen Kaku Gothic New",sans-serif;font-variant-numeric:tabular-nums}
  .seat small{color:var(--muted);font-size:10.5px}
  .seat.ok b{color:var(--green-ink)} .seat.left b{color:var(--amber)} .seat.full b{color:var(--red)}
  table.res{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  table.res th{background:var(--sheet-head);color:var(--muted);font-weight:500;text-align:left;padding:5px 5px;font-size:10.5px}
  table.res td{padding:5px 5px;border-bottom:1px solid var(--line)}
  table.res tr.new td{background:var(--amber-soft);font-weight:700}
  table.res tr.cancel td{color:var(--muted);text-decoration:line-through}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--code);color:var(--muted)}
  .tabelog{background:var(--paper);flex:1;padding:13px;color:var(--text);display:flex;flex-direction:column;gap:9px}
  .tabelog .brand{font-weight:900;color:#E9502E;font-family:"Zen Kaku Gothic New",sans-serif}
  .tabelog .row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;font-size:13px}
  .tabelog .row span:first-child{color:var(--muted)}
  .tabelog .btn{margin-top:auto;background:#E9502E;color:#fff;text-align:center;padding:11px;border-radius:10px;font-weight:700}

  /* backstage panels */
  .back{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:700px){.back{grid-template-columns:1fr}}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:150px;transition:box-shadow .25s,border-color .25s}
  .panel.on{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 18%,transparent)}
  .panel h3{font-size:12.5px;color:var(--muted);letter-spacing:.06em;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .panel h3 .pill{font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--code);color:var(--muted);letter-spacing:0}
  .panel h3 .pill.on{background:var(--green-soft);color:var(--green-ink)}
  .rbhead{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-weight:700;color:var(--rb);font-size:13px}
  .rbhead span{background:var(--rb-soft);padding:2px 8px;border-radius:6px;font-size:11px}
  table.rb{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  table.rb th{text-align:left;color:var(--muted);font-weight:500;font-size:10.5px;padding:4px 5px;border-bottom:1px solid var(--line)}
  table.rb td{padding:4px 5px;border-bottom:1px solid var(--line)}
  table.rb tr.new td{background:var(--rb-soft);font-weight:700}
  .mail{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:var(--code);border-radius:8px;padding:10px;white-space:pre-wrap;line-height:1.5;color:var(--text)}
  .mail .h{color:var(--muted)}
  .empty{color:var(--muted);font-size:12.5px}
  .gaslog{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.6;color:var(--text)}
  .gaslog .t{color:var(--muted)} .gaslog .ok{color:var(--green-ink)}
  table.sheet{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
  table.sheet th{background:var(--sheet-head);color:var(--muted);font-weight:500;text-align:left;padding:4px 5px;font-size:10.5px;border:1px solid var(--line)}
  table.sheet td{padding:4px 5px;border:1px solid var(--line)}
  table.sheet tr.new td{background:var(--amber-soft);font-weight:700}
  table.sheet tr.cancel td{color:var(--muted)}
  .sheettabs{display:flex;gap:4px;margin-top:8px}
  .sheettabs span{font-size:11px;padding:3px 10px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;background:var(--code);color:var(--muted)}
  .sheettabs span.on{background:var(--paper);color:var(--ink);font-weight:700}
  .daily{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .daily div{border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:11.5px;min-width:96px}
  .daily b{display:block;font-size:16px;font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink)}
  .daily div.hot{border-color:var(--amber);background:var(--amber-soft)}

  /* narration */
  .narr .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .eyebrow{font-size:11.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:700}
  .narr h2{font-size:18px;margin:4px 0 10px;font-weight:900}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13.5px;margin:0 0 10px}
  .kv dt{color:var(--muted);font-weight:500}.kv dd{margin:0;font-weight:700;color:var(--ink)}
  .cost{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;color:var(--green-ink);background:var(--green-soft);padding:3px 10px;border-radius:999px}
  .nav{display:flex;gap:8px;margin-top:12px}
  .nav button{font:inherit;font-weight:700;font-size:14px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;flex:1}
  .nav button.primary{background:var(--green);border-color:var(--green);color:#fff}
  .nav button:disabled{opacity:.4;cursor:default}
  .nav button:focus-visible,.stepper button:focus-visible,.sand button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .stepper{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 12px;padding:0;list-style:none}
  .stepper button{font:inherit;font-weight:700;font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer}
  .stepper button[aria-current="step"]{background:var(--ink);border-color:var(--ink);color:#fff}

  /* sandbox */
  .sand{margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .sand h2{font-size:16px;margin-bottom:4px}
  .sand p{margin:0 0 10px;color:var(--muted);font-size:13px}
  .sand form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
  .sand label{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
  .sand input,.sand select{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
  .sand button{font:inherit;font-weight:700;padding:9px 14px;border-radius:10px;border:0;background:var(--ink);color:#fff;cursor:pointer}
  .sand button.ghost{background:var(--code);color:var(--ink)}
  .sand .hint{font-size:12px;color:var(--muted);margin-top:8px}
  @media (prefers-reduced-motion: no-preference){ .msg,.new{animation:pop .25s ease-out both} @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>

<div class="wrap">
  <header>
    <h1>八十吉 通しデモ</h1>
    <span class="sub">構築が済んだ後の、お客様の指名から確定連絡まで。裏で予約がどう流れるかも同時に見える</span>
  </header>

  <div class="pipe" id="pipe"></div>

  <ul class="stepper" id="stepper" aria-label="場面"></ul>

  <div class="stage">
    <div class="phone"><div class="screen" id="screen"></div></div>

    <div class="back">
      <div class="panel" id="p-rb"><h3>レストランボード（台帳）<span class="pill">お店のiPad</span></h3><div id="rb"></div></div>
      <div class="panel" id="p-mail"><h3>予約通知メール<span class="pill">Gmail</span></h3><div id="mail"></div></div>
      <div class="panel" id="p-gas"><h3>GAS<span class="pill">5分おきに自動</span></h3><div id="gas"></div></div>
      <div class="panel" id="p-sheet"><h3>スプレッドシート<span class="pill">予約／日別</span></h3><div id="sheet"></div></div>
    </div>

    <div class="narr">
      <div class="card" id="explain"></div>
      <div class="nav">
        <button id="prev">← 前へ</button>
        <button id="next" class="primary">次へ →</button>
      </div>
    </div>
  </div>

  <div class="sand" id="sand">
    <h2>自分で予約を入れて、流れを動かす</h2>
    <p>ホットペッパー・食べログ・電話、どこから入っても同じ道を通ってスプシと「空き状況」に届きます。</p>
    <form id="form">
      <label>媒体<select name="src"><option>ホットペッパー</option><option>食べログ</option><option>電話</option></select></label>
      <label>時間<input name="time" value="20:00"></label>
      <label>席<input name="seats" type="number" min="1" max="30" value="3"></label>
      <label>予約者<input name="name" value="木村 様"></label>
      <label>コース<input name="course" value=""></label>
      <label>指名する人<input name="perf" value=""></label>
      <button type="submit">予約を入れる</button>
      <button type="button" class="ghost" id="cancelLast">最後の予約をキャンセル</button>
    </form>
    <div class="hint" id="hint">日にちはデモの9/20（土）固定。総席数30。</div>
  </div>
</div>

<script>
(function(){
  // ---------- データ ----------
  const TOTAL = 30;
  let res = [
    {id:'RB-1041', time:'17:30', name:'高橋 様', seats:2, src:'電話', course:'', perf:'', st:'予約'},
    {id:'RB-1042', time:'18:00', name:'田中 様', seats:4, src:'ホットペッパー', course:'飲み放題付き宴会コース', perf:'', st:'予約'},
    {id:'RB-1043', time:'18:30', name:'佐藤 様', seats:6, src:'食べログ', course:'おまかせコース', perf:'', st:'予約'},
    {id:'RB-1044', time:'19:00', name:'鈴木 様', seats:3, src:'電話', course:'', perf:'', st:'予約'},
    {id:'RB-1045', time:'20:00', name:'伊藤 様', seats:5, src:'ホットペッパー', course:'飲み放題付き宴会コース', perf:'', st:'予約'},
    {id:'RB-1046', time:'20:30', name:'渡辺 様', seats:2, src:'食べログ', course:'', perf:'', st:'予約'},
  ];
  let nextId = 1047;
  let newId = null;         // 直近に入った予約
  let mailFor = null;       // メール表示中の予約
  let gasLog = [];
  const NODES = ['予約が入る','レストランボード','予約通知メール','Gmail','GAS','スプレッドシート','空き状況（LINE内）'];

  const booked = () => res.filter(r=>r.st!=='キャンセル').reduce((a,r)=>a+r.seats,0);
  const left = () => TOTAL - booked();
  const sorted = () => [...res].sort((a,b)=>a.time.localeCompare(b.time));

  // ---------- 画面部品 ----------
  const bar = (t, who) => `<div class="bar"><span>${t}</span><span class="who">${who}</span></div>`;
  const richmenu = (hot) => `<div class="richmenu"><div class="${hot==='予約'?'hot':''}">ご予約</div><div>今から行く</div><div>お品書き</div><div>はじめての方へ</div><div>アクセス</div><div class="${hot==='空き'?'hot':''}">${hot==='空き'?'空き状況':'系列店'}</div></div>`;
  const msg = (side,name,text,link) => `<div class="msg ${side}">${name?`<span class="name">${name}</span>`:''}${text}${link?`<span class="link">${link}</span>`:''}</div>`;
  const sys = t => `<div class="sys">${t}</div>`;
  const chatScreen = (items,hot) => bar('八十吉','お客様のスマホ') + `<div class="chat">${items.join('')}</div>` + richmenu(hot);

  const liffScreen = () => {
    const l = left();
    return bar('空き状況','パフォーマーのスマホ') + `<div class="liff">
      <div class="date">9/20（土）<span>‹ 前日　翌日 ›</span></div>
      <div class="seats">
        <div class="seat"><small>総席数</small><b>${TOTAL}</b></div>
        <div class="seat"><small>予約済み</small><b>${booked()}</b></div>
        <div class="seat ${l<=0?'full':l<=4?'left':'ok'}"><small>残席</small><b>${l}</b></div>
      </div>
      <table class="res"><thead><tr><th>時間</th><th>予約者</th><th>席</th><th>指名</th></tr></thead><tbody>
      ${sorted().map(r=>`<tr class="${r.id===newId?'new':''} ${r.st==='キャンセル'?'cancel':''}"><td>${r.time}</td><td>${r.name}</td><td>${r.seats}</td><td>${r.perf||'<span class="tag">—</span>'}</td></tr>`).join('')}
      </tbody></table>
      <div class="empty" style="margin-top:auto">売上・単価は出ません。予約の時間・席・名前・指名だけ。</div></div>`;
  };
  const tabelogScreen = () => bar('食べログ','お客様のスマホ') + `<div class="tabelog">
      <div class="brand">食べログ ネット予約</div>
      <div style="font-weight:700;font-size:15px;color:var(--ink)">あさぶの居酒屋 八十吉</div>
      <div class="row"><span>来店日</span><span>9/20（土）</span></div>
      <div class="row"><span>時間</span><span>19:00</span></div>
      <div class="row"><span>人数</span><span>4名</span></div>
      <div class="row"><span>お名前</span><span>山田 太郎</span></div>
      <div class="row"><span>コース</span><span>おまかせコース</span></div>
      <div class="row"><span>ご要望</span><span>指名：ユウスケ</span></div>
      <div class="btn">この内容で予約する</div></div>`;

  // ---------- 裏側パネル ----------
  const rbPanel = () => `<div class="rbhead">予約台帳 9/20（土）<span>ホットペッパー連携</span><span>SC取込</span></div>
    <table class="rb"><thead><tr><th>時間</th><th>お名前</th><th>人数</th><th>経路</th><th>要望</th></tr></thead><tbody>
    ${sorted().map(r=>`<tr class="${r.id===newId?'new':''}"><td>${r.time}</td><td>${r.name}</td><td>${r.seats}</td><td>${r.src}</td><td>${r.st==='キャンセル'?'<span class="tag">キャンセル</span>':(r.perf?'指名：'+r.perf:'')}</td></tr>`).join('')}
    </tbody></table>`;
  const mailPanel = () => {
    if(!mailFor) return `<div class="empty">まだ届いていません。予約が台帳に入ると、レストランボードが自動で送ります。</div>`;
    const r = mailFor;
    return `<div class="mail"><span class="h">From: レストランボード &lt;noreply@restaurant-board&gt;
To: yasokichi.yoyaku@gmail.com
件名:</span> 【レストランボード】${r.st==='キャンセル'?'予約がキャンセルされました':'予約を受け付けました'}（${r.src}）

予約番号　${r.id}
来店日時　2026/09/20（土） ${r.time}
人数　　　${r.seats}名
お名前　　${r.name}
コース　　${r.course||'—'}
ご要望　　${r.perf?'指名：'+r.perf:'—'}
経路　　　${r.src}</div>`;
  };
  const gasPanel = () => gasLog.length ? `<div class="gaslog">${gasLog.map(l=>`<div><span class="t">${l.t}</span> ${l.m}</div>`).join('')}</div>` : `<div class="empty">5分おきにGmailを見に行きます。新しいメールが無ければ何もしません。</div>`;
  const sheetPanel = () => `<div class="sheettabs"><span class="on">予約</span><span>日別</span><span>設定</span><span>ログ</span></div>
    <table class="sheet"><thead><tr><th>予約者</th><th>日にち</th><th>時間</th><th>コース</th><th>席</th><th>指名する人</th><th style="color:#9AA0B3">ステータス</th><th style="color:#9AA0B3">媒体</th></tr></thead><tbody>
    ${sorted().map(r=>`<tr class="${r.id===newId?'new':''} ${r.st==='キャンセル'?'cancel':''}"><td>${r.name}</td><td>2026/09/20</td><td>${r.time}</td><td>${r.course||''}</td><td>${r.seats}</td><td>${r.perf||''}</td><td>${r.st}</td><td>${r.src}</td></tr>`).join('')}
    </tbody></table>
    <div class="daily"><div>日別 9/20<b>${booked()} 席</b>予約席数</div><div class="${left()<=4?'hot':''}">残席<b>${left()}</b>総席数 ${TOTAL} −</div></div>`;

  // ---------- 場面 ----------
  const m0 = msg('you','八十吉','ご予約ありがとうございます。下記をコピーして、埋めたうえでお送りください。\n\nご希望日：　月　日（　）\nお時間：　時　分ごろ\n人数：　名\nご指名：\nご要望：\n\n※お席と出演者の空き状況を確認いたしますので、この時点ではご予約は確定しておりません。');
  const m1 = msg('me','','ご希望日：9月20日（土）\nお時間：19時ごろ\n人数：4名\nご指名：ユウスケ\nご要望：マジックを見たいです');
  const m2 = msg('you','ユウスケ（八十吉）','ご指名ありがとうございます！ユウスケです。\n9/20（土）19時ごろ・4名で承りました。\nお席の空きを確認しますので少々お待ちください。\n\n※この時点ではまだご予約は確定していません。');
  const m25 = msg('you','ユウスケ（八十吉）','9/20（土）は次の時間帯でご案内できます。\n\n・19:00〜\n・20:30〜\n\n先着順でのご案内です。ご希望の時間を返信してください。');
  const m3u = msg('me','','19:00でお願いします！');
  const m3 = msg('you','ユウスケ（八十吉）','19:00〜 4名 で承ります。\nマジックショーは20時ごろから、お席で。\n\n下のリンクから本予約をお願いします。ご要望欄に「指名：ユウスケ」とお書きください。\n予約できたら、日時をこのトークに送ってください。\n\n※お席の確保期限：本日23:00','🔗 食べログで予約する（9/20 19:00 4名）');
  const m4 = msg('me','','予約しました！\n9/20（土）19:00 4名です');
  const m5 = msg('you','ユウスケ（八十吉）','ご予約を確認しました！\n\n◇ご予約日時　9/20（土）19:00\n◇人数　4名\n◇ご指名　ユウスケ\n\nご来店を心よりお待ちしております。');

  const YAMADA = {id:'RB-1047', time:'19:00', name:'山田 様', seats:4, src:'食べログ', course:'おまかせコース', perf:'ユウスケ', st:'予約'};

  const scenes = [
    { label:'0 開始前', node:-1, panel:null, before(){ res=res.filter(r=>r.id!=='RB-1047'); newId=null; mailFor=null; gasLog=[]; },
      screen:()=>chatScreen([sys('友だち追加'), msg('you','八十吉','友だち追加ありがとうございます。\nあさぶの居酒屋 八十吉です。\n\nご予約は下のメニュー「ご予約」からどうぞ。')],'予約'),
      html:`<div class="eyebrow">開始前</div><h2>9/20（土）、すでに6組が台帳に入っている</h2>
        <p>ホットペッパー・食べログ・電話で入った予約は、全部レストランボードの台帳にあります。その1件1件が、右の道を通ってスプレッドシートにも入っています。残席は <b>8</b>。</p>
        <div class="kv"><dt>人が触るもの</dt><dd>なし</dd><dt>費用</dt><dd>0円</dd></div>` },
    { label:'1 指名', node:-1, panel:null,
      screen:()=>chatScreen([sys('「ご予約」をタップ'), m0, m1],'予約'),
      html:`<div class="eyebrow">1 ／ LINE</div><h2>お客様が日時・人数・指名を送る</h2>
        <div class="kv"><dt>誰が</dt><dd>お客様</dd><dt>どこで</dt><dd>LINEのトーク</dd></div>
        <p>操作権限を持つパフォーマー全員に通知が届き、指名された本人が担当になります。</p><span class="cost">通数：0</span>` },
    { label:'2 一時返信', node:-1, panel:null,
      screen:()=>chatScreen([m1, m2],''),
      html:`<div class="eyebrow">2 ／ LINE</div><h2>パフォーマーが「受け取りました」（未確定）</h2>
        <p>定型文をそのまま。「この時点では確定していません」を必ず入れます。</p><span class="cost">通数：0</span>` },
    { label:'2.5 空きを見る', node:6, panel:'p-sheet',
      screen:()=>liffScreen(),
      html:`<div class="eyebrow">2.5 ／ 空き状況</div><h2>パフォーマーがLINEの中で残席を見る</h2>
        <div class="kv"><dt>誰が</dt><dd>パフォーマー</dd><dt>どこで</dt><dd>リッチメニュー「空き状況」</dd><dt>見ているもの</dt><dd>スプレッドシートの「日別」と「予約」</dd></div>
        <p>レストランボードは開きません。売上はこの画面にもスプシにも存在しません。19:00は残席 <b>8</b>。</p><span class="cost">通数：0</span>` },
    { label:'2.5 時間帯', node:-1, panel:null,
      screen:()=>chatScreen([m2, m25],''),
      html:`<div class="eyebrow">2.5 ／ LINE</div><h2>ご案内できる時間帯を提示。先着順</h2>
        <p>さっき見た残席をもとに、19:00〜と20:30〜を出しています。</p><span class="cost">通数：0</span>` },
    { label:'3 条件提示', node:-1, panel:null,
      screen:()=>chatScreen([m3u, m3],''),
      html:`<div class="eyebrow">3 ／ LINE</div><h2>時間・人数を確定し、予約リンクを送る</h2>
        <p>要望欄に「指名：ユウスケ」と書いてもらう。確保期限も明記。</p><span class="cost">通数：0</span>` },
    { label:'4 食べログで予約', node:0, panel:null,
      screen:()=>tabelogScreen(),
      html:`<div class="eyebrow">4 ／ 食べログ</div><h2>お客様が本予約。ここで席が決まる</h2>
        <p>お席の在庫は台帳側で判定されます。同じ席に二重で入ることはありません。ここから先は<b>全部自動</b>です。</p>` },
    { label:'4 台帳へ', node:1, panel:'p-rb', before(){ if(!res.find(r=>r.id==='RB-1047')) res.push({...YAMADA}); newId='RB-1047'; },
      screen:()=>tabelogScreen(),
      html:`<div class="eyebrow">4 ／ レストランボード</div><h2>食べログの予約が台帳に入る</h2>
        <p>サイトコントローラー経由で、レストランボードの台帳に山田様 19:00 4名が載りました。お店のiPadで見えるのはここまで通常どおり。</p>
        <div class="kv"><dt>人が触るもの</dt><dd>なし</dd></div>` },
    { label:'4 メール', node:2, panel:'p-mail', before(){ mailFor = res.find(r=>r.id==='RB-1047'); },
      screen:()=>tabelogScreen(),
      html:`<div class="eyebrow">4 ／ 予約通知メール</div><h2>レストランボードが通知メールを送る</h2>
        <p>標準の「メール通知設定」をオンにしてあるだけ。宛先はGAS用に作ったGmail。<b>売上はこのメールに載らない。</b></p>` },
    { label:'4 Gmail', node:3, panel:'p-mail',
      screen:()=>tabelogScreen(),
      html:`<div class="eyebrow">4 ／ Gmail</div><h2>メールがGmailに届く</h2>
        <p>誰も開きません。GASが読みに来るのを待つだけ。</p>` },
    { label:'4 GAS', node:4, panel:'p-gas', before(){ gasLog=[
        {t:'21:05:00', m:'Gmailを検索：from:(restaurant-board) newer_than:1d'},
        {t:'21:05:01', m:'新着 1件：【レストランボード】予約を受け付けました（食べログ）'},
        {t:'21:05:01', m:'読み取り：山田 様／2026/09/20 19:00／4席／おまかせコース／指名：ユウスケ'},
        {t:'21:05:02', m:'メールID 18c3…f2 は未登録 → 「予約」に1行追加'},
        {t:'21:05:02', m:'<span class="ok">完了。次は 21:10 に見に来ます</span>'},
      ]; },
      screen:()=>tabelogScreen(),
      html:`<div class="eyebrow">4 ／ GAS</div><h2>GASがメールを読んで、スプシに1行足す</h2>
        <p>5分おきに動く。同じメールを二度読まないように、メールIDを控えています。</p>
        <div class="kv"><dt>人が触るもの</dt><dd>なし</dd><dt>費用</dt><dd>0円</dd></div>` },
    { label:'4 スプシ', node:5, panel:'p-sheet',
      screen:()=>tabelogScreen(),
      html:`<div class="eyebrow">4 ／ スプレッドシート</div><h2>「予約」に行が増え、「日別」の残席が変わる</h2>
        <p>予約席数 22 → <b>26</b>、残席 8 → <b>4</b>。数式なので即時。</p>` },
    { label:'4 日時を送付', node:-1, panel:null,
      screen:()=>chatScreen([m3, m4],''),
      html:`<div class="eyebrow">4 ／ LINE</div><h2>お客様が「予約しました」とLINEに送る</h2>
        <p>LINE側と予約側を突き合わせるための一言です。</p><span class="cost">通数：0</span>` },
    { label:'5 確認', node:6, panel:'p-sheet',
      screen:()=>liffScreen(),
      html:`<div class="eyebrow">5 ／ 空き状況</div><h2>パフォーマーが同じ画面で「入っている」を確認</h2>
        <p>色付きの行が山田様。指名も載っている。お店が台帳を開いて突き合わせる作業はありません。</p><span class="cost">通数：0</span>` },
    { label:'5 確定連絡', node:-1, panel:null,
      screen:()=>chatScreen([m4, m5],''),
      html:`<div class="eyebrow">5 ／ LINE</div><h2>「〇〇で承りました」。ここで確定</h2>
        <p>この流れ全体で、レストランボードのログイン 0回、手入力 0回、配信通数 0、月額 0円。</p>
        <p style="margin-top:8px;color:var(--muted);font-size:13px">下の砂場で、別の予約やキャンセルを入れると、同じ道を通って残席が動きます。</p>` },
  ];

  // ---------- 描画 ----------
  const pipeEl = document.getElementById('pipe');
  const stepper = document.getElementById('stepper');
  const screen = document.getElementById('screen');
  const explain = document.getElementById('explain');
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  let i = 0;

  NODES.forEach((n,idx)=>{ const d=document.createElement('div'); d.className='node'; d.id='node'+idx; d.innerHTML=`<small>${idx===0?'入口':idx===6?'見る':'自動'}</small><b>${n}</b>`; pipeEl.appendChild(d); });
  scenes.forEach((s,idx)=>{ const li=document.createElement('li'); const b=document.createElement('button'); b.type='button'; b.textContent=s.label; b.addEventListener('click',()=>{go(idx);}); li.appendChild(b); stepper.appendChild(li); });

  function renderPanels(){
    document.getElementById('rb').innerHTML = rbPanel();
    document.getElementById('mail').innerHTML = mailPanel();
    document.getElementById('gas').innerHTML = gasPanel();
    document.getElementById('sheet').innerHTML = sheetPanel();
  }
  function go(idx){
    // 途中から飛んでも状態が合うように、0から順に before を流す
    for(let k=0;k<=idx;k++){ if(scenes[k].before) scenes[k].before(); }
    i = idx; render();
  }
  function render(){
    const s = scenes[i];
    screen.innerHTML = s.screen();
    explain.innerHTML = s.html;
    renderPanels();
    NODES.forEach((_,idx)=>{ const el=document.getElementById('node'+idx); el.classList.toggle('on', idx===s.node); el.classList.toggle('done', s.node>=0 && idx<s.node); });
    ['p-rb','p-mail','p-gas','p-sheet'].forEach(id=>document.getElementById(id).classList.toggle('on', id===s.panel));
    [...stepper.querySelectorAll('button')].forEach((b,idx)=>{ if(idx===i) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
    prev.disabled = i===0;
    next.textContent = i===scenes.length-1 ? '最初に戻る' : '次へ →';
    const chat=screen.querySelector('.chat'); if(chat) chat.scrollTop=chat.scrollHeight;
  }
  prev.addEventListener('click',()=>{ if(i>0) go(i-1); });
  next.addEventListener('click',()=>{ go((i+1)%scenes.length); });
  document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') next.click(); if(e.key==='ArrowLeft') prev.click(); });

  // ---------- 砂場 ----------
  const form = document.getElementById('form');
  const hint = document.getElementById('hint');
  const sleep = ms => new Promise(r=>setTimeout(r, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : ms));
  async function runPipeline(r, isCancel){
    const setNode = n => NODES.forEach((_,idx)=>{ const el=document.getElementById('node'+idx); el.classList.toggle('on', idx===n); el.classList.toggle('done', idx<n); });
    const setPanel = id => ['p-rb','p-mail','p-gas','p-sheet'].forEach(p=>document.getElementById(p).classList.toggle('on', p===id));
    newId = r.id;
    setNode(0); hint.textContent = `${r.src}で${isCancel?'キャンセル':'予約'}が入りました…`; await sleep(500);
    setNode(1); setPanel('p-rb'); renderPanels(); hint.textContent='レストランボードの台帳に反映'; await sleep(700);
    setNode(2); setPanel('p-mail'); mailFor=r; renderPanels(); hint.textContent='通知メールが送られる'; await sleep(700);
    setNode(3); hint.textContent='Gmailに届く'; await sleep(500);
    setNode(4); setPanel('p-gas'); gasLog=[
      {t:'--:--:00', m:'Gmailを検索：from:(restaurant-board) newer_than:1d'},
      {t:'--:--:01', m:`新着 1件：【レストランボード】${isCancel?'予約がキャンセルされました':'予約を受け付けました'}（${r.src}）`},
      {t:'--:--:01', m:`読み取り：${r.name}／2026/09/20 ${r.time}／${r.seats}席${r.perf?'／指名：'+r.perf:''}`},
      {t:'--:--:02', m: isCancel ? `予約番号 ${r.id} を検索 → ステータスを「キャンセル」に` : `メールID は未登録 → 「予約」に1行追加`},
      {t:'--:--:02', m:'<span class="ok">完了</span>'},
    ]; renderPanels(); hint.textContent='GASがメールを読む'; await sleep(900);
    setNode(5); setPanel('p-sheet'); renderPanels(); hint.textContent='スプシに反映。日別の残席が変わる'; await sleep(700);
    setNode(6); screen.innerHTML = liffScreen(); hint.textContent = `空き状況に反映。残席 ${left()}。`;
    await sleep(600); setPanel(null);
  }
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(form);
    const r = { id:'RB-'+(nextId++), time:(f.get('time')||'20:00').trim(), name:(f.get('name')||'名無し 様').trim(), seats:Math.max(1,parseInt(f.get('seats')||'1',10)), src:f.get('src'), course:(f.get('course')||'').trim(), perf:(f.get('perf')||'').trim(), st:'予約' };
    if(r.seats > left()){ hint.textContent = `残席 ${left()} に対して ${r.seats} 席。予約ページ側で満席になり、この予約は入りません。`; return; }
    res.push(r);
    await runPipeline(r, false);
  });
  document.getElementById('cancelLast').addEventListener('click', async ()=>{
    const last = [...res].reverse().find(r=>r.st!=='キャンセル');
    if(!last){ hint.textContent='キャンセルできる予約がありません。'; return; }
    last.st='キャンセル';
    await runPipeline(last, true);
  });

  go(0);
})();
</script>
